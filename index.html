<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where Should I Be?</title>
<meta name="description" content="A soccer positioning quiz for a 2-1-2-1 team on a 7v7 pitch with build-out lines.">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Where Should I Be?">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #eaf3ff;
  --card: #ffffff;
  --ink: #0f172a;
  --muted: #526077;
  --line: #d7e1ef;
  --blue: #1d4ed8;
  --blue-deep: #1e3a8a;
  --blue-soft: #e0eaff;
  --gold: #f5b301;
  --good: #15803d;
  --good-soft: #dcfce7;
  --close: #4d7c0f;
  --ok: #b45309;
  --ok-soft: #fef3c7;
  --bad: #b91c1c;
  --bad-soft: #fee2e2;
  --shadow: 0 6px 24px rgba(15, 23, 42, .08);
  --grass-a: #2e8b45;
  --grass-b: #33964b;
  --grass-edge: #277a3c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1324;
    --card: #131d33;
    --ink: #e8eef9;
    --muted: #9aa8bf;
    --line: #26344f;
    --blue: #3b6ff0;
    --blue-deep: #1e3a8a;
    --blue-soft: #1b2b4d;
    --good: #4ade80;
    --good-soft: #12301f;
    --close: #a3e635;
    --ok: #fbbf24;
    --ok-soft: #3a2a0a;
    --bad: #f87171;
    --bad-soft: #3b1515;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    --grass-a: #26763a;
    --grass-b: #2a7f3f;
    --grass-edge: #1f6431;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1324;
  --card: #131d33;
  --ink: #e8eef9;
  --muted: #9aa8bf;
  --line: #26344f;
  --blue: #3b6ff0;
  --blue-deep: #1e3a8a;
  --blue-soft: #1b2b4d;
  --good: #4ade80;
  --good-soft: #12301f;
  --close: #a3e635;
  --ok: #fbbf24;
  --ok-soft: #3a2a0a;
  --bad: #f87171;
  --bad-soft: #3b1515;
  --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  --grass-a: #26763a;
  --grass-b: #2a7f3f;
  --grass-edge: #1f6431;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
/* Everything is sized in rem, and the root size grows with the screen,
   so the game fills a big monitor, a tablet or a phone without zooming. */
html {
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
  font-size: clamp(15px, min(1.55vw, 2.6vh), 30px);
}
@media (orientation: portrait), (max-width: 600px) {
  html { font-size: clamp(15px, min(2vw + 9px, 4vh), 21px); }
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Fredoka', ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 1.0625rem;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 120rem; margin: 0 auto;
  padding: 0.625rem max(1rem, env(safe-area-inset-right)) 1rem max(1rem, env(safe-area-inset-left));
}
h2, h3 { margin: 0; line-height: 1.2; }
p { margin: 0; }
.card {
  background: var(--card);
  border: 0.0625rem solid var(--line);
  border-radius: 1.25rem;
  padding: 1.125rem;
  box-shadow: var(--shadow);
}

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.25rem 0 0.75rem; }
.brand { display: flex; align-items: center; gap: 0.625rem; font-weight: 700; font-size: 1.5rem; min-width: 0; }
.logo { flex: none; display: grid; place-items: center; width: 2.625rem; height: 2.625rem; border-radius: 50%; background: var(--blue); font-size: 1.5rem; }
/* when the header gets crowded during a game, keep just the ball logo */
.top { container-type: inline-size; }
@container (max-width: 36rem) {
  .brand { font-size: 1.25rem; }
  body:not([data-screen="setup"]) .brand-text { display: none; }
}
.top-actions { display: flex; gap: 0.5rem; flex: none; }

/* buttons */
.btn {
  font: inherit;
  font-weight: 600;
  border: 0;
  border-radius: 0.875rem;
  padding: 0.6875rem 1rem;
  cursor: pointer;
  background: var(--blue-soft);
  color: var(--ink);
  transition: transform .08s ease, filter .15s ease;
}
.btn:hover { filter: brightness(1.04); }
.btn:active { transform: translateY(0.0625rem); }
.btn:focus-visible, .icon-btn:focus-visible, .opt:focus-visible { outline: 0.1875rem solid var(--gold); outline-offset: 0.125rem; }
.btn.primary { background: var(--blue); color: #fff; box-shadow: 0 0.25rem 0 var(--blue-deep); }
.btn.primary:active { box-shadow: 0 0.125rem 0 var(--blue-deep); transform: translateY(0.125rem); }
.btn.big { font-size: 1.25rem; padding: 0.875rem 1.25rem; }
.btn.wide { width: 100%; }
.btn.small { font-size: 0.9375rem; padding: 0.5rem 0.75rem; border-radius: 0.75rem; }
.btn.ghost { background: transparent; border: 0.125rem solid var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.icon-btn {
  flex: none; font: inherit; font-size: 1.25rem; line-height: 1;
  width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--blue-soft); color: var(--ink);
}

/* setup */
.setup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(17.5rem, 22.5rem); gap: 1.125rem; align-items: start; max-width: 51.25rem; margin: 0 auto; }
.pick-card { text-align: center; }
.mini-pitch { max-width: max(14rem, min(22rem, calc((100vh - 16rem) * 50 / 69.2))); margin: 0.75rem auto 0.625rem; }
.mini-pitch { max-width: max(14rem, min(22rem, calc((100dvh - 16rem) * 50 / 69.2))); }
.mini-pitch svg { width: 100%; height: auto; display: block; border-radius: 0.875rem; }
.role-name { font-size: 1.625rem; font-weight: 700; }
.best { color: var(--ok); font-weight: 600; margin-top: 0.125rem; min-height: 1.4em; }
.go-card { display: grid; gap: 1rem; }
.name-input {
  font: inherit; width: 100%; padding: 0.6875rem 0.875rem; border-radius: 0.75rem;
  border: 0.125rem solid var(--line); background: var(--bg); color: var(--ink);
}
.name-input:focus { outline: none; border-color: var(--blue); }
.toggles { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.toggle { position: relative; }
.toggle input, .switch input { position: absolute; opacity: 0; width: 0.0625rem; height: 0.0625rem; }
.toggle span {
  display: inline-block; padding: 0.5625rem 0.875rem; border-radius: 62.4375rem;
  border: 0.125rem solid var(--line); font-weight: 600; cursor: pointer; user-select: none;
}
.toggle input:checked + span { background: var(--blue); border-color: var(--blue); color: #fff; }
.toggle input:focus-visible + span { outline: 0.1875rem solid var(--gold); outline-offset: 0.125rem; }
.switch { position: relative; display: flex; align-items: center; gap: 0.75rem; cursor: pointer; font-weight: 500; }
.switch .track { flex: none; width: 2.875rem; height: 1.75rem; border-radius: 62.4375rem; background: var(--line); position: relative; transition: background .2s; }
.switch .track::after {
  content: ''; position: absolute; top: 0.1875rem; left: 0.1875rem; width: 1.375rem; height: 1.375rem; border-radius: 50%;
  background: #fff; box-shadow: 0 0.0625rem 0.1875rem rgba(0, 0, 0, .3); transition: transform .2s;
}
.switch input:checked + .track { background: var(--blue); }
.switch input:checked + .track::after { transform: translateX(1.125rem); }
.switch input:focus-visible + .track { outline: 0.1875rem solid var(--gold); outline-offset: 0.125rem; }

/* quiz */
.quiz {
  display: grid;
  --cw: min(34rem, 46vw); /* width of the question column */
  container-type: inline-size;
  grid-template-columns: auto var(--cw);
  grid-template-areas: "pitch q" "pitch fb" "pitch legend";
  grid-template-rows: auto auto 1fr;
  gap: 1rem 1.25rem;
  align-items: start;
  justify-content: center;
}
.qcard { grid-area: q; display: grid; gap: 0.75rem; }
.fbcard { grid-area: fb; }
.pitch-box {
  grid-area: pitch;
  justify-self: center;
  /* as tall as the screen allows, and never wider than the space left of the questions */
  width: max(12rem, min(calc(100vw - var(--cw) - 4rem), calc((100vh - 5.5rem) * 50 / 69.2)));
  width: max(12rem, min(calc(100cqw - var(--cw) - 1.25rem), calc((100dvh - 5.5rem) * 50 / 69.2)));
}
#pitch { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 1rem; }
.legend { grid-area: legend; display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; justify-content: center; font-size: 0.875rem; color: var(--muted); margin-top: 0.5rem; }
.legend span { display: inline-flex; align-items: center; gap: 0.3125rem; }
.lg { display: inline-block; width: 0.8125rem; height: 0.8125rem; border-radius: 50%; }
.lg.blue { background: #1d4ed8; border: 0.125rem solid #fff; box-shadow: 0 0 0 0.0625rem #94a3b8; }
.lg.white { background: #fff; border: 0.125rem solid #1f2937; }
.lg.you { background: #1d4ed8; border: 0.1875rem solid #fbbf24; }
.lg.zone { width: 1.125rem; height: 0.75rem; border-radius: 0.25rem; background: rgba(253, 224, 71, .5); border: 0.125rem dashed #eab308; }

.qtop { display: flex; align-items: center; justify-content: space-between; gap: 0.625rem; }
.role-pill { font-weight: 700; font-size: 0.9375rem; padding: 0.25rem 0.625rem; border-radius: 62.4375rem; background: #1d4ed8; color: #fff; border: 0.125rem solid #fbbf24; white-space: nowrap; }
.dots { display: flex; gap: 0.25rem; flex: 1; justify-content: center; flex-wrap: wrap; }
.dots i { width: 0.6875rem; height: 0.6875rem; border-radius: 50%; background: var(--line); }
.dots i.cur { background: transparent; box-shadow: inset 0 0 0 0.1562rem var(--blue); }
.dots i.s5 { background: #22c55e; }
.dots i.s3 { background: #84cc16; }
.dots i.s1 { background: #f59e0b; }
.dots i.s0 { background: #ef4444; }
.starcount { white-space: nowrap; font-weight: 600; }
.poss { justify-self: start; padding: 0.4375rem 0.875rem; border-radius: 62.4375rem; font-weight: 700; font-size: 1.125rem; }
.poss.we { background: #1d4ed8; color: #fff; }
.poss.they { background: #fff; color: #1f2937; border: 0.125rem solid #94a3b8; }
.poss.loose { background: #fde047; color: #1f2937; }
.qline { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.qtext { font-size: 1.625rem; font-weight: 700; }
.step-tag { font-size: 0.875rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

.options { display: grid; gap: 0.625rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: center; text-align: left;
  font: inherit; font-size: 1.125rem; font-weight: 600; line-height: 1.25;
  padding: 0.75rem 0.875rem; border-radius: 0.875rem; cursor: pointer;
  border: 0.125rem solid var(--line); background: var(--card); color: var(--ink);
}
.opt:hover { border-color: var(--blue); }
.opt .letter {
  flex: none; width: 2.125rem; height: 2.125rem; border-radius: 50%;
  display: grid; place-items: center; background: var(--blue); color: #fff; font-weight: 700;
}

/* one answer box: verdict, a tick for each part, then one message */
.answer { border-radius: 0.875rem; padding: 0.75rem 0.875rem 0.875rem; }
.answer.good { background: var(--good-soft); }
.answer.half { background: var(--ok-soft); }
.answer.learn { background: var(--blue-soft); }
.verdict { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.375rem 0.75rem; margin-bottom: 0.5rem; }
.verdict h3 { font-size: 1.5rem; }
.answer.good h3 { color: var(--good); }
.answer.half h3 { color: var(--ok); }
.vright { display: flex; align-items: center; gap: 0.375rem; margin-left: auto; }
.vscore { margin-left: 0.375rem; font-size: 1.25rem; font-weight: 700; white-space: nowrap; }
.chk {
  display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.1875rem 0.625rem; border-radius: 999px;
  background: var(--card); font-size: 0.9375rem; font-weight: 700; white-space: nowrap;
}
.answer-body { display: grid; gap: 0.375rem; font-size: 1.125rem; font-weight: 500; line-height: 1.35; }
.lesson { display: flex; gap: 0.5rem; align-items: flex-start; }
.lesson .ico { flex: none; }
.lesson b { font-weight: 700; }
.tip { background: var(--blue-soft); border-radius: 0.875rem; padding: 0.75rem 0.875rem; font-size: 1.125rem; font-weight: 500; }
.tip + .tip { margin-top: 0.5rem; }
.row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0; }
.post-row { align-items: center; margin-bottom: 0; }
.post-row #nextBtn { flex: 1 1 9rem; }
.coach-select { font: inherit; width: 100%; margin-bottom: 0.75rem; padding: 0.5625rem 0.75rem; border-radius: 0.75rem; border: 0.125rem solid var(--line); background: var(--bg); color: var(--ink); }

/* phones and tablets held upright: one column, pitch as big as fits */
@media (orientation: portrait), (max-width: 600px) {
  .setup { grid-template-columns: 1fr; }
  .mini-pitch { max-width: max(14rem, min(22rem, calc((100vh - 31rem) * 50 / 69.2))); }
  .mini-pitch { max-width: max(14rem, min(22rem, calc((100dvh - 31rem) * 50 / 69.2))); }
  .quiz { grid-template-columns: minmax(0, 1fr); grid-template-areas: "q" "pitch" "legend" "fb"; grid-template-rows: auto; }
  .legend { margin-top: -0.5rem; }
  .pitch-box { width: min(100%, max(22rem, calc((100vh - 21rem) * 50 / 69.2))); }
  .pitch-box { width: min(100%, max(22rem, calc((100dvh - 21rem) * 50 / 69.2))); }
  .fbcard.pre, .fbcard.act { position: sticky; bottom: 0.625rem; z-index: 5; padding: 0.625rem; }
  .opt { font-size: 1.0625rem; padding: 0.625rem 0.75rem; }
  .qtext { font-size: 1.4375rem; }
}
@media (max-width: 480px) {
  .brand { font-size: 1.1875rem; }
  .btn-word { display: none; }
  .logo { width: 2.125rem; height: 2.125rem; font-size: 1.25rem; }
}

.fs-btn { display: inline-grid; place-items: center; min-width: 2.75rem; }
.fs-btn svg { width: 1.25rem; height: 1.25rem; display: block; }
.toast {
  position: fixed; left: 50%; bottom: max(1.25rem, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60;
  width: max-content; max-width: calc(100vw - 2rem); padding: 0.75rem 1.125rem; border-radius: 1rem;
  background: var(--ink); color: var(--bg); font-weight: 600; text-align: center; box-shadow: var(--shadow);
}

/* results */
.results { max-width: 35rem; margin: 0.625rem auto; text-align: center; }
.trophy { font-size: 4rem; line-height: 1.1; }
.rstars { font-size: 1.875rem; font-weight: 700; margin: 0.375rem 0; }
.newbest { display: inline-block; background: #fef3c7; color: #92400e; font-weight: 700; padding: 0.1875rem 0.625rem; border-radius: 62.4375rem; margin-top: 0.375rem; }
.rlist { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin: 1rem 0; }
.rlist span { padding: 0.3125rem 0.625rem; border-radius: 0.75rem; background: var(--blue-soft); font-size: 0.9375rem; }
.results .row { justify-content: center; }

/* confetti */
#confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
#confetti i { position: absolute; top: -0.875rem; width: 0.625rem; height: 0.875rem; border-radius: 0.125rem; animation: fall linear forwards; }
@keyframes fall { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(110vh) rotate(720deg); } }

/* pitch drawing */
svg text { font-family: inherit; }
.grass-edge { fill: var(--grass-edge); }
.stripe-a { fill: var(--grass-a); }
.stripe-b { fill: var(--grass-b); }
.lines * { fill: none; stroke: rgba(255, 255, 255, .9); stroke-width: .22; }
.lines .spot { fill: #fff; stroke: none; }
.goal { fill: rgba(255, 255, 255, .85); stroke: #fff; stroke-width: .2; }
.buildout { stroke: #fde68a; stroke-width: .3; stroke-dasharray: 1 .7; }
.buildout.hot { stroke: #fde047; stroke-width: .5; }
.pitch-label { fill: rgba(255, 255, 255, .92); font-size: 1.3px; font-weight: 700; letter-spacing: .12px; }
.pitch-label.side { font-size: 1.15px; }
.bo-label { fill: #fde68a; font-size: .9px; font-weight: 600; }
.restrict-lbl { fill: #fff; font-size: 1.2px; font-weight: 700; paint-order: stroke; stroke: rgba(0, 0, 0, .4); stroke-width: .28px; }
.zone { fill: rgba(253, 224, 71, .4); stroke: #fde047; stroke-width: .32; stroke-dasharray: .9 .5; animation: zonePulse 1.4s ease-in-out infinite; }
@keyframes zonePulse { 50% { fill: rgba(253, 224, 71, .18); } }
.zone-team { fill: rgba(147, 197, 253, .2); stroke: rgba(219, 234, 254, .95); stroke-width: .18; stroke-dasharray: .6 .4; }
.zone-team-lbl { fill: #eff6ff; font-size: .95px; font-weight: 700; paint-order: stroke; stroke: rgba(30, 58, 138, .6); stroke-width: .2px; }
.ghost { fill: none; stroke: rgba(255, 255, 255, .8); stroke-width: .2; stroke-dasharray: .5 .4; }
.ghost-lbl { fill: rgba(255, 255, 255, .9); font-size: .9px; font-weight: 600; }
.trail { stroke: rgba(255, 255, 255, .55); stroke-width: .2; stroke-dasharray: .5 .4; fill: none; }
.arrow { stroke: #fde047; stroke-width: .38; stroke-dasharray: .8 .5; fill: none; }
.drag-hint { fill: #fff; font-size: 1px; font-weight: 700; pointer-events: none; }
.ball-c { fill: #fff; stroke: #111; stroke-width: .12; }
.ball-p { fill: #111; }
.pl { transition: opacity .35s ease; }
.pl.hidden { opacity: 0; }
.pl .body { stroke-width: .3; }
.pl.blue .body { fill: #1d4ed8; stroke: #fff; }
.pl.white .body { fill: #fff; stroke: #1f2937; }
.pl .lbl { font-size: 1.15px; font-weight: 700; pointer-events: none; }
.pl.blue .lbl { fill: #fff; }
.pl.white .lbl { fill: #1f2937; }
.pl.you .body, .pl.me .body, .pick.sel .body { stroke: #fbbf24; stroke-width: .55; }
.pl.you .lbl { font-size: .95px; }
.pl .star { fill: #fbbf24; font-size: 1.5px; pointer-events: none; display: none; }
.pl.you .star, .pl.me .star { display: block; }
.pl.you { cursor: grab; }
.pl.you.locked { cursor: default; }
.pl.you:focus { outline: none; }
.pl.you:focus-visible .body { stroke: #fde047; stroke-width: .7; }
.you-pulse { display: none; fill: none; stroke: #fde047; stroke-width: .3; transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-out infinite; }
.pl.you .you-pulse, .pick.sel .you-pulse { display: block; }
.pl.you.locked .you-pulse { display: none; }
@keyframes pulse { 0% { opacity: .9; transform: scale(.65); } 100% { opacity: 0; transform: scale(1.35); } }
.pick { cursor: pointer; }
.pick:hover .body { fill: #2563eb; }
.pick:focus { outline: none; }
.pick:focus-visible .body { stroke: #fde047; stroke-width: .65; }

@media (prefers-reduced-motion: reduce) {
  .zone, .you-pulse { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">⚽</span><span class="brand-text">Where Should I Be?</span></div>
    <div class="top-actions">
      <button class="btn ghost small" id="voiceBtn" type="button"></button>
      <button class="btn ghost small" id="homeBtn" type="button" hidden>← Back</button>
      <button class="btn ghost small fs-btn" id="fsBtn" type="button"></button>
    </div>
  </header>

  <main>
    <!-- SETUP -->
    <section id="setup" class="setup">
      <div class="card pick-card">
        <h2>Pick your position</h2>
        <div class="mini-pitch"><svg id="setupPitch" role="group" aria-label="Pick your position"></svg></div>
        <p class="role-name" id="roleName"></p>
        <p class="best" id="roleBest"></p>
      </div>
      <div class="card go-card">
        <input class="name-input" id="nameInput" type="text" maxlength="20" placeholder="Your name" aria-label="Your name (optional)" autocomplete="off">
        <div class="toggles" role="group" aria-label="What to practice">
          <label class="toggle"><input type="checkbox" value="gk" checked><span>🥅 Goal kicks</span></label>
          <label class="toggle"><input type="checkbox" value="open" checked><span>⚡ Open play</span></label>
          <label class="toggle"><input type="checkbox" value="trans" checked><span>🔄 Transitions</span></label>
        </div>

/* ------------------------------------------------------------------
   Positioning engine. Each shape returns a zone per role:
   { x, y, hw, hh, job } where (x, y) is the ideal spot, hw/hh are
   the half-width/half-height of the "good" zone and job is a JOBS
   key. An optional `alt` zone is also accepted in hard mode. The same
   engine drives the white team by mirroring the pitch.
------------------------------------------------------------------- */
const GOAL = { x: 20, y: 0 };
const towardMiddle = x => (x < 20 ? 1 : -1);
function Z(x, y, hw, hh, job) { return { x: clamp(x, 1, 39), y: clamp(y, 1, 59), hw, hh, job }; }
function goalSide(b, d) {
  const dx = GOAL.x - b.x, dy = GOAL.y - b.y, m = Math.hypot(dx, dy) || 1;
  return { x: b.x + dx / m * d, y: b.y + dy / m * d };
}
function pressZone(b, role) { const p = goalSide(b, 3); return Z(p.x, p.y, 3.5, 3.5, PRESS_JOB[role]); }

// Nudge teammates apart so no two zones sit on top of each other.
function relax(s, fixed) {
  const MIN = 5;
  for (let it = 0; it < 4; it++) {
    for (let i = 0; i < ROLES.length; i++) {
      for (let j = i + 1; j < ROLES.length; j++) {
        const ra = ROLES[i], rb = ROLES[j], fa = fixed.has(ra), fb = fixed.has(rb);
        if (fa && fb) continue;
        const a = s[ra], b = s[rb];
        let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d >= MIN) continue;
        if (d < 0.01) { dx = 1; dy = 0; d = 1; }
        const push = MIN - d, ux = dx / d, uy = dy / d;
        const wa = fa ? 0 : fb ? 1 : 0.5, wb = fb ? 0 : fa ? 1 : 0.5;
        a.x = clamp(a.x - ux * push * wa, 1, 39); a.y = clamp(a.y - uy * push * wa, 1, 59);
        b.x = clamp(b.x + ux * push * wb, 1, 39); b.y = clamp(b.y + uy * push * wb, 1, 59);
      }
    }
  }
  return s;
}

// Defenders in attack: one goes, one stays.
const defGoZone = (r, b) => Z(20 + INFO[r].side * 10, clamp(b.y - 6, 16, 42), 6, 6, 'defGo');
const defStayZone = (r, b) => Z(20 + INFO[r].side * 3 + (b.x - 20) * 0.15, clamp(b.y - 10, 8, 27), 6, 5, 'defStay');

  const c = 20 + (b.x - 20) * 0.3;

// Who presses the ball first. Aggressive: we press everywhere.
function defaultPresser(b) {
  const ln = laneOf(b.x);

  if (ln === 0) return b.y > 12 ? 'CM' : null;
  if (b.y < 18) return ln < 0 ? 'LD' : 'RD';
  return ln < 0 ? 'LW' : 'RW';

// Spots around the ball for extra pressers: inside, behind (cut the pass back), outside.

    { x: b.x + tm * 1.2, y: b.y + 3.6 },
    { x: b.x - tm * 3, y: b.y + 1.5 },

// Who joins the counterpress after we lose the ball (or chase a loose ball).
// If an attacker loses it, the other two attackers swarm it. Otherwise the
// nearest teammate helps, but one defender always stays back.
const FRONT = ['LW', 'ST', 'RW'];

  const dist = r => Math.hypot(before[r].x - b.x, before[r].y - b.y);
  if (FRONT.includes(lead)) return FRONT.filter(r => r !== lead).sort((a, c) => dist(a) - dist(c));
  const defs = ['LD', 'RD'];
  const stayer = defs.includes(lead) ? defs.find(r => r !== lead) : defs.slice().sort((a, c) => dist(c) - dist(a))[0];
  return ROLES.filter(r => r !== 'GK' && r !== lead && r !== stayer).sort((a, c) => dist(a) - dist(c)).slice(0, 1);
}

// opts: { lead, helpers, helpJob }. Without opts we use the default press:

function defendShape(b, opts = {}) {

  else if (high) s.CM = Z(20 + (b.x - 20) * 0.4, clamp(b.y - 8, 24, 42), 6, 5, 'cmHigh');

      else if (b.y < 14) s[r] = Z(20 + sd * 9, 15, 5, 4.5, 'wingCorner');
      else if (b.y < 18) s[r] = Z(clamp(b.x + sd * 2.5, 2, 38), b.y - 4, 4.5, 4.5, 'wingDouble');

  }

    ? Z(20 + (b.x - 20) * 0.4, clamp(b.y - 2, 32, 48), 5, 4, 'stHigh')
    : Z(20 + (b.x - 20) * 0.3, 32, 5, 4, 'stLow');

  if (lead) { s[lead] = pressZone(b, lead); fixed.add(lead); }

  helpers.forEach((r, i) => { s[r] = Z(slots[i].x, slots[i].y, 4, 4, helpJob); fixed.add(r); });

}

function ourGoalKickShape() {

    GK: Z(16, 4, 3, 3, null),
    LD: Z(6, 8, 5, 5, 'ogkD'), RD: Z(34, 8, 5, 5, 'ogkD'),
    CM: Z(20, 16, 5, 4, 'ogkCM'),
    LW: Z(4, 27, 4, 6, 'ogkW'), RW: Z(36, 27, 4, 6, 'ogkW'),
    ST: Z(20, 42, 6, 6, 'ogkST'),

}
function theirGoalKickShape() {
  return {
    GK: Z(20, 11, 5, 4, 'tgkGK'),
    LD: Z(13, 15, 6, 5, 'tgkD'), RD: Z(27, 15, 6, 5, 'tgkD'),
    CM: Z(20, 31, 6, 4, 'tgkCM'),
    LW: Z(9.5, 36, 5, 3, 'tgkW'), RW: Z(30.5, 36, 5, 3, 'tgkW'),

    }
    case 'defend': {

      f.target[lead] = Z(b.x, b.y - 0.8, 3.5, 3.5, 'loose');

const isTrans = sit => sit.phase === 'lost' || sit.phase === 'won' || sit.phase === 'loose';

const holdsBall = (sit, r) => (sit.phase === 'ourGK' && r === 'GK') || (sit.carrier === r && sit.phase !== 'lost');

function tipFor(sit, role, zone) {

  if (sit.phase === 'loose' && zone.job !== 'loose') return 'Loose ball! ' + tip;
  if (sit.phase === 'won') return 'We won it! ' + tip;

}

// Why the spot matters right after the ball changes hands.
function phaseLead(sit, z) {

  if (sit.phase === 'loose') return 'When the ball pops loose, the closest players attack it and everyone else gets ready in case they win it.';
  if (sit.phase === 'won') return 'We just won it, so everyone switches to attacking straight away.';

// The situation in plain words, for when both answers were wrong.

    case 'theirGK': return "It's their goal kick. We have to wait behind the dotted build-out line until their keeper passes.";
    case 'attack': return 'Our team has the ball.';
    case 'defend': return 'The other team has the ball.';

    case 'won': return 'We just won the ball! Now our team is attacking.';

/* One message for the whole answer:

    lines: [`That's ${place}, ${t.at}, and the right move is to ${t.move}.`],

  const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const step = now => {
    const t = Math.min(1, (now - t0) / dur), e = ease(t);
    for (const m of moves) place(m.g, { x: m.from.x + (m.to.x - m.from.x) * e, y: m.from.y + (m.to.y - m.from.y) * e });
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------------- voice ----------------
   Questions and results are read out automatically (toggle in the header).
   Speech always starts from a tap, which browsers require. */
const canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
const voice = { on: store.get('voice', true), pick: null };
function pickVoice() {
  try {
    const score = v => (/natural|neural|premium|enhanced/i.test(v.name) ? 4 : 0)
      + (/samantha|aria|jenny|ava|allison|google us english/i.test(v.name) ? 3 : 0)
      + (/^en[-_]US/i.test(v.lang) ? 1 : 0);
    voice.pick = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)).sort((a, b) => score(b) - score(a))[0] || null;
  } catch (e) { voice.pick = null; }
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, force) {
  if (!canSpeak || !text || (!voice.on && !force)) return;
  try {
    speechSynthesis.cancel();
    const clean = text.replace(/[^\p{L}\p{N}\p{P}\s]/gu, '').replace(/\s+/g, ' ').trim();
    // Short chunks: some browsers cut off long utterances.
    for (const part of clean.match(/[^.!?]+[.!?]*/g) || []) {
      const u = new SpeechSynthesisUtterance(part.trim());
      if (voice.pick) u.voice = voice.pick;
      u.rate = 0.95;
      u.pitch = 1.05;
      speechSynthesis.speak(u);
    }
  } catch (e) { /* speech unavailable */ }
}
function hush() { if (canSpeak) try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
function renderVoiceBtn() {
  const b = $('#voiceBtn');
  b.hidden = !canSpeak;
  b.innerHTML = (voice.on ? '🔊' : '🔇') + '<span class="btn-word"> Voice</span>';

/* ---------------- quiz ---------------- */
const Q = {};
const cur = () => state.round[state.i];

function buildRound() {
  const pools = { gk: [], open: [], trans: [] };
  for (const sit of SITUATIONS) {
    const cat = PHASES[sit.phase].cat;
    if (!state.phases.includes(cat) || holdsBall(sit, state.role)) continue;
    pools[cat].push(sit);
  }
  Object.values(pools).forEach(shuffle);
  // Always include "you got tackled" for this position.
  const mine = pools.trans.findIndex(s => s.phase === 'lost' && s.carrier === state.role);
  if (mine > 0) pools.trans.unshift(pools.trans.splice(mine, 1)[0]);

  const N = 10, weights = { gk: 2, open: 4, trans: 4 };
  const cats = state.phases.filter(c => pools[c].length);
  const totalW = cats.reduce((a, c) => a + weights[c], 0);
  const quota = {};
  cats.forEach(c => { quota[c] = Math.min(pools[c].length, Math.round(N * weights[c] / totalW)); });
  const count = () => cats.reduce((a, c) => a + quota[c], 0);
  while (count() < N) {
    const open = cats.filter(c => quota[c] < pools[c].length).sort((a, b) => quota[a] / weights[a] - quota[b] / weights[b]);
    if (!open.length) break;
    quota[open[0]]++;
  }
  while (count() > N) quota[cats.slice().sort((a, b) => quota[b] - quota[a])[0]]--;
  const picked = [];
  cats.forEach(c => picked.push(...pools[c].slice(0, quota[c])));
  return shuffle(picked).map(sit => ({
    sit, role: state.role, frame: buildFrame(sit), trans: isTrans(sit), stars: null,
  }));
}

function startRound() {
  hush();
  state.coach = false;
  state.round = buildRound();
  state.i = 0;
  state.stars = 0;
  show('quiz');
  renderQuestion();
}

function svgPt(e) {
  const m = Q.svg.getScreenCTM();
  if (!m) return null;
  const pt = Q.svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(m.inverse());
  return { x: p.x, y: L - p.y };
}
function moveYou(p) {
  if (!p) return;
  Q.youPos = { x: clamp(p.x, -2.4, 44.4), y: clamp(p.y, -3, L + 3) };
  place(Q.you, Q.youPos);
  if (!state.moved) {
    state.moved = true;
    if (Q.benchHint) Q.benchHint.remove();
    $('#checkBtn').disabled = false;
  }
}
function onDown(e) {
  if (state.coach || state.step !== 'place' || !cur()) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  const p = svgPt(e);
  if (!p) return;
  Q.dragging = true;
  try { Q.svg.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  if (Q.you.contains(e.target)) Q.off = { x: Q.youPos.x - p.x, y: Q.youPos.y - p.y };
  else { Q.off = { x: 0, y: 0 }; moveYou(p); }
}
function onMove(e) {
  if (!Q.dragging) return;
  e.preventDefault();
  const p = svgPt(e);
  if (p) moveYou({ x: p.x + Q.off.x, y: p.y + Q.off.y });
}
function onUp(e) {
  if (!Q.dragging) return;
  Q.dragging = false;
  try { Q.svg.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
}
function onYouKey(e) {
  if (state.step !== 'place' || state.coach) return;
  const step = e.shiftKey ? 3 : 1;
  let p = { ...Q.youPos };
  if (!state.moved && !cur().trans && e.key.startsWith('Arrow')) p = { x: 20, y: 30 };
  else if (e.key === 'ArrowUp') p.y += step;
  else if (e.key === 'ArrowDown') p.y -= step;
  else if (e.key === 'ArrowLeft') p.x -= step;
  else if (e.key === 'ArrowRight') p.x += step;
  else if (e.key === 'Enter') { e.preventDefault(); if (state.moved) lockSpot(); return; }
  else return;
  e.preventDefault();
  moveYou(p);
}

// Step 1: where should you be?
function renderQuestion() {
  const q = cur(), f = q.frame, sit = q.sit, Ls = Q.P.layers;

  const pos = q.trans ? f.before : f;

    place(g, pos.white[r]);
    Q.els.white[r] = g;
  }
  for (const r of ROLES) {
    if (r === q.role) continue;
    const g = makePlayer(Ls.players, 'blue', r);

// Step 2: what should you do? (Nothing is revealed until this is answered.)
function lockSpot() {
  const q = cur();
  if (!q || state.step !== 'place' || !state.moved) return;
  state.step = 'act';
  Q.dragging = false;
  Q.you.classList.add('locked');

  const p = Q.youPos;
  let z = q.frame.target[q.role], d = distToZone(p, z);
  if (state.hard && z.alt) {
    const da = distToZone(p, z.alt);
    if (da < d) { z = z.alt; d = da; }
  }
  const off = p.x < 0 || p.x > W || p.y < 0 || p.y > L;
  const crossed = q.sit.phase === 'theirGK' && p.y > BO_OPP;
  let spot = d === 0 ? 3 : d <= 4 ? 2 : d <= 8 ? 1 : 0;
  if (off || crossed) spot = 0;
  q.zone = z;
  q.spot = { stars: spot, off, crossed };

  const job = JOBS[z.job];
  q.options = shuffle([{ text: job.act, ok: true }, ...shuffle(job.wrong.slice()).slice(0, 2).map(t => ({ text: t, ok: false }))]);
  const box = $('#options');
  box.textContent = '';
  q.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = 'ABC'[i];
    const label = document.createElement('span');
    label.textContent = o.text;
    b.append(letter, label);
    b.addEventListener('click', () => answer(i));
    box.appendChild(b);
  });
  showPanel('act');
  const say = 'What should you do? ' + q.options.map((o, i) => `${'ABC'[i]}: ${sentence(o.text)}`).join(' ');
  setPrompt('2. Your move', 'What should you do?', say);
  box.querySelector('.opt').focus({ preventScroll: true });
}

// Step 3: score both answers, reveal, and explain.
function answer(i) {
  const q = cur();
  if (!q || state.step !== 'act') return;
  state.step = 'done';
  const f = q.frame, z = q.zone, p = Q.youPos;
  const moveOk = q.options[i].ok;
  const total = q.spot.stars + (moveOk ? MOVE_POINTS : 0);
  q.stars = total;
  state.stars += total;

  const Ls = Q.P.layers;
  Q.zone = drawZone(Ls.zones, z, 'zone');
  Ls.players.querySelectorAll('.hidden').forEach(g => g.classList.remove('hidden'));
  if (q.trans) {
    const moves = [];
    for (const r of ROLES) {
      if (r !== q.role) moves.push({ g: Q.els.blue[r], from: f.before.blue[r], to: f.blue[r] });
      moves.push({ g: Q.els.white[r], from: f.before.white[r], to: f.white[r] });
    }
    animateMoves(moves, 1200);
  }
  if (q.spot.stars < 3) drawArrow(p, z);

  const fb = feedbackFor(q, moveOk);
  $('#answer').className = 'answer ' + fb.kind;
  $('#vTitle').textContent = fb.title;
  $('#vScore').textContent = `⭐ ${total}/${Q_MAX}`;
  $('#chkSpot').textContent = `📍 Spot ${fb.spotOk ? '✅' : '❌'}`;
  $('#chkMove').textContent = `⚡ Move ${moveOk ? '✅' : '❌'}`;
  const body = $('#answerBody');
  body.textContent = '';
  const said = [];
  for (const line of fb.lines) {
    const p = document.createElement('p');
    if (typeof line === 'string') {
      p.textContent = line;
      said.push(line);
    } else {
      p.className = 'lesson';
      const ico = document.createElement('span'), words = document.createElement('span'), b = document.createElement('b');
      ico.className = 'ico';
      ico.textContent = line.ico;
      b.textContent = line.label;
      words.append(b, ' ' + line.text);
      p.append(ico, words);
      said.push(`${line.label} ${line.text}`);
    }
    body.appendChild(p);
  }
  $('#showMeBtn').hidden = q.spot.stars === SPOT_MAX;
  $('#teamBtn').textContent = '👥 Team';
  $('#nextBtn').textContent = state.i + 1 < state.round.length ? 'Next ➜' : 'Score 🏆';
  $('#starTotal').textContent = state.stars;
  showPanel('post');
  renderDots();

  Q.sayResult = `${fb.title} ${said.join(' ')}`;
  speak(Q.sayResult);
  if (total === Q_MAX) confetti(40);
  $('#nextBtn').focus({ preventScroll: true });
  // side-by-side layout: make sure Next is on screen without hunting for it
  requestAnimationFrame(() => {
    const nb = $('#nextBtn').getBoundingClientRect();
    if (!oneColumn() && nb.bottom > innerHeight) window.scrollBy({ top: nb.bottom - innerHeight + 16, behavior: reduceMotion ? 'auto' : 'smooth' });
  });
}

function drawArrow(from, z) {
  if (Q.arrow) Q.arrow.remove();
  const dx = z.x - from.x, dy = z.y - from.y, len = Math.hypot(dx, dy);
  if (len < 2.5) return;
  const s = 1.9 / len;
  Q.arrow = el('line', {
    x1: from.x + dx * s, y1: sy(from.y + dy * s), x2: z.x, y2: sy(z.y),
    class: 'arrow', 'marker-end': `url(#${Q.P.id}Arrow)`,
  }, Q.P.layers.arrows);
}
function showMe() {
  const z = cur().zone;
  if (Q.arrow) { Q.arrow.remove(); Q.arrow = null; }
  animateMoves([{ g: Q.you, from: { ...Q.youPos }, to: { x: z.x, y: z.y } }], 700);
  Q.youPos = { x: z.x, y: z.y };
}
function drawTeamZones(sit, frame, me) {
  const Ls = Q.P.layers, group = el('g', null);
  Ls.zones.insertBefore(group, Ls.zones.firstChild);
  for (const r of ROLES) {
    if (r === me || holdsBall(sit, r)) continue;
    const z = frame.target[r], rr = zoneRect(z);
    drawZone(group, z, 'zone-team');
    txt(group, rr.x1 + 0.4, sy(rr.y2) + 1.1, r, 'zone-team-lbl', { 'text-anchor': 'start' });
  }
  return group;
}
function toggleTeam() {
  const q = cur();
  if (Q.teamZones) { Q.teamZones.remove(); Q.teamZones = null; $('#teamBtn').textContent = '👥 Team'; return; }
  Q.teamZones = drawTeamZones(q.sit, q.frame, q.role);
  $('#teamBtn').textContent = '👥 Hide';
}
function next() {
  hush();
  state.i++;
  if (state.i >= state.round.length) showResults();
  else {
    renderQuestion();
    if (oneColumn()) $('#quiz').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  }
}

/* ---------------- results ---------------- */
function showResults() {
  const max = state.round.length * Q_MAX, pct = max ? state.stars / max : 0;
  const key = 'best:' + state.role, best = store.get(key, null);
  const newBest = !best || pct > best.stars / best.max;
  if (newBest) store.set(key, { stars: state.stars, max });
  const title = pct >= 0.9 ? 'Superstar!' : pct >= 0.7 ? 'Great job!' : pct >= 0.4 ? 'Good effort!' : 'Keep practicing!';
  $('#rTrophy').textContent = pct >= 0.9 ? '🏆' : pct >= 0.7 ? '🥇' : pct >= 0.4 ? '👍' : '⚽';
  $('#rTitle').textContent = title;
  $('#rBest').innerHTML = newBest && best ? '<span class="newbest">New best! 🎉</span>' : '';
  $('#rStars').textContent = `⭐ ${state.stars} of ${max}`;
  const list = $('#rList');
  list.textContent = '';
  state.round.forEach(q => {
    const s = document.createElement('span');
    s.textContent = `${PHASES[q.sit.phase].icon} ${q.stars || 0}/${Q_MAX}`;
    list.appendChild(s);
  });
  selectRole(state.role);
  show('results');
  speak(`${title} You got ${state.stars} out of ${max} stars.${newBest && best ? ' That is a new best!' : ''}`);
  if (pct >= 0.7) confetti(120);
}

/* ---------------- coach view ---------------- */
function startCoach() {
  hush();
  state.coach = true;
  state.ci = 0;
  $('#coachRole').value = state.role;
  show('quiz');
  renderCoach();
}
function renderCoach() {
  const sit = SITUATIONS[state.ci], f = buildFrame(sit), Ls = Q.P.layers, role = state.role;
  clearPitch();
  drawRestriction(Q.P, sit.phase);
  const iHoldIt = holdsBall(sit, role);
  if (!iHoldIt) Q.zone = drawZone(Ls.zones, f.target[role], 'zone');
  Q.teamZones = drawTeamZones(sit, f, role);
  if (f.before) {
    for (const r of ROLES) {
      const a = f.before.blue[r], b = f.blue[r];
      if (Math.hypot(b.x - a.x, b.y - a.y) < 1) continue;
      el('line', { x1: a.x, y1: sy(a.y), x2: b.x, y2: sy(b.y), class: 'trail' }, Ls.arrows);
      el('circle', { cx: a.x, cy: sy(a.y), r: 0.6, class: 'ghost' }, Ls.arrows);
    }
  }
  for (const r of ROLES) place(makePlayer(Ls.players, 'white', r === 'GK' ? 'GK' : ''), f.white[r]);
  for (const r of ROLES) {
    const g = makePlayer(r === role ? Ls.you : Ls.players, 'blue', r);
    if (r === role) g.classList.add('me');
    place(g, f.blue[r]);
  }
  place(makeBall(Ls.you), f.ball);

  setSituation(sit, null);
  $('#stepTag').textContent = 'Coach view';
  $('#qtext').textContent = `Situation ${state.ci + 1} of ${SITUATIONS.length}`;
  $('#youRole').textContent = INFO[role].name;
  $('#starBox').hidden = true;
  $('#qdots').hidden = true;
  $('#readBtn').hidden = true;
  const z = f.target[role];
  $('#coachTip').textContent = iHoldIt ? 'Has the ball.' : '📍 ' + tipFor(sit, role, z);
  $('#coachAct').textContent = iHoldIt ? '' : '⚡ ' + sentence(JOBS[z.job].act);
  $('#coachAct').hidden = iHoldIt;
  showPanel('coach');
}

/* ---------------- go ---------------- */
initSetup();
initQuiz();
show('setup');
})();
</script>
</body>
