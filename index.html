<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where Should I Be?</title>
<meta name="description" content="A soccer positioning quiz for a 2-1-2-1 team on a 7v7 pitch with build-out lines.">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Where Should I Be?">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #eaf3ff;
  --card: #ffffff;
  --ink: #0f172a;
  --muted: #526077;
  --line: #d7e1ef;
  --blue: #1d4ed8;
  --blue-deep: #1e3a8a;
  --blue-soft: #e0eaff;
  --gold: #f5b301;
  --good: #15803d;
  --good-soft: #dcfce7;
  --close: #4d7c0f;
  --ok: #b45309;
  --ok-soft: #fef3c7;
  --bad: #b91c1c;
  --bad-soft: #fee2e2;
  --shadow: 0 6px 24px rgba(15, 23, 42, .08);
  --grass-a: #2e8b45;
  --grass-b: #33964b;
  --grass-edge: #277a3c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1324;
    --card: #131d33;
    --ink: #e8eef9;
    --muted: #9aa8bf;
    --line: #26344f;
    --blue: #3b6ff0;
    --blue-deep: #1e3a8a;
    --blue-soft: #1b2b4d;
    --good: #4ade80;
    --good-soft: #12301f;
    --close: #a3e635;
    --ok: #fbbf24;
    --ok-soft: #3a2a0a;
    --bad: #f87171;
    --bad-soft: #3b1515;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    --grass-a: #26763a;
    --grass-b: #2a7f3f;
    --grass-edge: #1f6431;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1324;
  --card: #131d33;
  --ink: #e8eef9;
  --muted: #9aa8bf;
  --line: #26344f;
  --blue: #3b6ff0;
  --blue-deep: #1e3a8a;
  --blue-soft: #1b2b4d;
  --good: #4ade80;
  --good-soft: #12301f;
  --close: #a3e635;
  --ok: #fbbf24;
  --ok-soft: #3a2a0a;
  --bad: #f87171;
  --bad-soft: #3b1515;
  --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  --grass-a: #26763a;
  --grass-b: #2a7f3f;
  --grass-edge: #1f6431;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
/* Everything is sized in rem, and the root size grows with the screen,
   so the game fills a big monitor, a tablet or a phone without zooming. */
html {
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
  font-size: clamp(15px, min(1.55vw, 2.6vh), 30px);
}
@media (orientation: portrait), (max-width: 600px) {
  html { font-size: clamp(15px, min(2vw + 9px, 4vh), 21px); }
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Fredoka', ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 1.0625rem;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 120rem; margin: 0 auto;
  padding: 0.625rem max(1rem, env(safe-area-inset-right)) 1rem max(1rem, env(safe-area-inset-left));
}
h2, h3 { margin: 0; line-height: 1.2; }
p { margin: 0; }
.card {
  background: var(--card);
  border: 0.0625rem solid var(--line);
  border-radius: 1.25rem;
  padding: 1.125rem;
  box-shadow: var(--shadow);
}

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.25rem 0 0.75rem; }
.brand { display: flex; align-items: center; gap: 0.625rem; font-weight: 700; font-size: 1.5rem; min-width: 0; }
.logo { flex: none; display: grid; place-items: center; width: 2.625rem; height: 2.625rem; border-radius: 50%; background: var(--blue); font-size: 1.5rem; }
/* when the header gets crowded during a game, keep just the ball logo */
.top { container-type: inline-size; }
@container (max-width: 36rem) {
  .brand { font-size: 1.25rem; }
  body:not([data-screen="setup"]) .brand-text { display: none; }
}
.top-actions { display: flex; gap: 0.5rem; flex: none; }

/* buttons */
.btn {
  font: inherit;
  font-weight: 600;
  border: 0;
  border-radius: 0.875rem;
  padding: 0.6875rem 1rem;
  cursor: pointer;
  background: var(--blue-soft);
  color: var(--ink);
  transition: transform .08s ease, filter .15s ease;
}
.btn:hover { filter: brightness(1.04); }
.btn:active { transform: translateY(0.0625rem); }
.btn:focus-visible, .icon-btn:focus-visible, .opt:focus-visible { outline: 0.1875rem solid var(--gold); outline-offset: 0.125rem; }
.btn.primary { background: var(--blue); color: #fff; box-shadow: 0 0.25rem 0 var(--blue-deep); }
.btn.primary:active { box-shadow: 0 0.125rem 0 var(--blue-deep); transform: translateY(0.125rem); }
.btn.big { font-size: 1.25rem; padding: 0.875rem 1.25rem; }
.btn.wide { width: 100%; }
.btn.small { font-size: 0.9375rem; padding: 0.5rem 0.75rem; border-radius: 0.75rem; }
.btn.ghost { background: transparent; border: 0.125rem solid var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.icon-btn {
  flex: none; font: inherit; font-size: 1.25rem; line-height: 1;
  width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--blue-soft); color: var(--ink);
}

/* setup */
.setup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(17.5rem, 22.5rem); gap: 1.125rem; align-items: start; max-width: 51.25rem; margin: 0 auto; }
.pick-card { text-align: center; }
.mini-pitch { max-width: max(14rem, min(22rem, calc((100vh - 16rem) * 50 / 69.2))); margin: 0.75rem auto 0.625rem; }
.mini-pitch { max-width: max(14rem, min(22rem, calc((100dvh - 16rem) * 50 / 69.2))); }
.mini-pitch svg { width: 100%; height: auto; display: block; border-radius: 0.875rem; }
.role-name { font-size: 1.625rem; font-weight: 700; }
.best { color: var(--ok); font-weight: 600; margin-top: 0.125rem; min-height: 1.4em; }
.go-card { display: grid; gap: 1rem; }
.position-field { display: grid; gap: 0.375rem; font-weight: 600; }
.name-input, .position-input {
  font: inherit; width: 100%; padding: 0.6875rem 0.875rem; border-radius: 0.75rem;
  border: 0.125rem solid var(--line); background: var(--bg); color: var(--ink);
}
.name-input:focus, .position-input:focus { outline: none; border-color: var(--blue); }
.toggles { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.toggle { position: relative; }
.toggle input, .switch input { position: absolute; opacity: 0; width: 0.0625rem; height: 0.0625rem; }
.toggle span {
  display: inline-block; padding: 0.5625rem 0.875rem; border-radius: 62.4375rem;
  border: 0.125rem solid var(--line); font-weight: 600; cursor: pointer; user-select: none;
}
.toggle input:checked + span { background: var(--blue); border-color: var(--blue); color: #fff; }
.toggle input:disabled + span { background: var(--line); border-color: var(--line); color: var(--muted); opacity: .65; cursor: not-allowed; }
.toggle input:focus-visible + span { outline: 0.1875rem solid var(--gold); outline-offset: 0.125rem; }
.switch { position: relative; display: flex; align-items: center; gap: 0.75rem; cursor: pointer; font-weight: 500; }
.switch .track { flex: none; width: 2.875rem; height: 1.75rem; border-radius: 62.4375rem; background: var(--line); position: relative; transition: background .2s; }
.switch .track::after {
  content: ''; position: absolute; top: 0.1875rem; left: 0.1875rem; width: 1.375rem; height: 1.375rem; border-radius: 50%;
  background: #fff; box-shadow: 0 0.0625rem 0.1875rem rgba(0, 0, 0, .3); transition: transform .2s;
}
.switch input:checked + .track { background: var(--blue); }
.switch input:checked + .track::after { transform: translateX(1.125rem); }
.switch input:focus-visible + .track { outline: 0.1875rem solid var(--gold); outline-offset: 0.125rem; }

/* quiz */
.quiz {
  display: grid;
  --cw: min(34rem, 46vw); /* width of the question column */
  container-type: inline-size;
  grid-template-columns: auto var(--cw);
  grid-template-areas: "pitch q" "pitch fb" "pitch legend";
  grid-template-rows: auto auto 1fr;
  gap: 1rem 1.25rem;
  align-items: start;
  justify-content: center;
}
.qcard { grid-area: q; display: grid; gap: 0.75rem; }
.fbcard { grid-area: fb; }
.pitch-box {
  grid-area: pitch;
  justify-self: center;
  /* as tall as the screen allows, and never wider than the space left of the questions */
  width: max(12rem, min(calc(100vw - var(--cw) - 4rem), calc((100vh - 5.5rem) * 50 / 69.2)));
  width: max(12rem, min(calc(100cqw - var(--cw) - 1.25rem), calc((100dvh - 5.5rem) * 50 / 69.2)));
}
#pitch { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 1rem; }
.legend { grid-area: legend; display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; justify-content: center; font-size: 0.875rem; color: var(--muted); margin-top: 0.5rem; }
.legend span { display: inline-flex; align-items: center; gap: 0.3125rem; }
.lg { display: inline-block; width: 0.8125rem; height: 0.8125rem; border-radius: 50%; }
.lg.blue { background: #1d4ed8; border: 0.125rem solid #fff; box-shadow: 0 0 0 0.0625rem #94a3b8; }
.lg.white { background: #fff; border: 0.125rem solid #1f2937; }
.lg.you { background: #1d4ed8; border: 0.1875rem solid #fbbf24; }
.lg.zone { width: 1.125rem; height: 0.75rem; border-radius: 0.25rem; background: rgba(253, 224, 71, .5); border: 0.125rem dashed #eab308; }

.qtop { display: flex; align-items: center; justify-content: space-between; gap: 0.625rem; }
.role-pill { font-weight: 700; font-size: 0.9375rem; padding: 0.25rem 0.625rem; border-radius: 62.4375rem; background: #1d4ed8; color: #fff; border: 0.125rem solid #fbbf24; white-space: nowrap; }
.dots { display: flex; gap: 0.25rem; flex: 1; justify-content: center; flex-wrap: wrap; }
.dots i { width: 0.6875rem; height: 0.6875rem; border-radius: 50%; background: var(--line); }
.dots i.cur { background: transparent; box-shadow: inset 0 0 0 0.1562rem var(--blue); }
.dots i.s5 { background: #22c55e; }
.dots i.s3 { background: #84cc16; }
.dots i.s1 { background: #f59e0b; }
.dots i.s0 { background: #ef4444; }
.starcount { white-space: nowrap; font-weight: 600; }
.poss { justify-self: start; padding: 0.4375rem 0.875rem; border-radius: 62.4375rem; font-weight: 700; font-size: 1.125rem; }
.poss.we { background: #1d4ed8; color: #fff; }
.poss.they { background: #fff; color: #1f2937; border: 0.125rem solid #94a3b8; }
.poss.loose { background: #fde047; color: #1f2937; }
.qline { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.qtext { font-size: 1.625rem; font-weight: 700; }
.step-tag { font-size: 0.875rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

.options { display: grid; gap: 0.625rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: center; text-align: left;
  font: inherit; font-size: 1.125rem; font-weight: 600; line-height: 1.25;
  padding: 0.75rem 0.875rem; border-radius: 0.875rem; cursor: pointer;
  border: 0.125rem solid var(--line); background: var(--card); color: var(--ink);
}
.opt:hover { border-color: var(--blue); }
.opt .letter {
  flex: none; width: 2.125rem; height: 2.125rem; border-radius: 50%;
  display: grid; place-items: center; background: var(--blue); color: #fff; font-weight: 700;
}

/* one answer box: verdict, a tick for each part, then one message */
.answer { border-radius: 0.875rem; padding: 0.75rem 0.875rem 0.875rem; }
.answer.good { background: var(--good-soft); }
.answer.half { background: var(--ok-soft); }
.answer.learn { background: var(--blue-soft); }
.verdict { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.375rem 0.75rem; margin-bottom: 0.5rem; }
.verdict h3 { font-size: 1.5rem; }
.answer.good h3 { color: var(--good); }
.answer.half h3 { color: var(--ok); }
.vright { display: flex; align-items: center; gap: 0.375rem; margin-left: auto; }
.vscore { margin-left: 0.375rem; font-size: 1.25rem; font-weight: 700; white-space: nowrap; }
.chk {
  display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.1875rem 0.625rem; border-radius: 999px;
  background: var(--card); font-size: 0.9375rem; font-weight: 700; white-space: nowrap;
}
.answer-body { display: grid; gap: 0.375rem; font-size: 1.125rem; font-weight: 500; line-height: 1.35; }
.lesson { display: flex; gap: 0.5rem; align-items: flex-start; }
.lesson .ico { flex: none; }
.lesson b { font-weight: 700; }
.tip { background: var(--blue-soft); border-radius: 0.875rem; padding: 0.75rem 0.875rem; font-size: 1.125rem; font-weight: 500; }
.tip + .tip { margin-top: 0.5rem; }
.row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0; }
.post-row { align-items: center; margin-bottom: 0; }
.post-row #nextBtn { flex: 1 1 9rem; }
.coach-select { font: inherit; width: 100%; margin-bottom: 0.75rem; padding: 0.5625rem 0.75rem; border-radius: 0.75rem; border: 0.125rem solid var(--line); background: var(--bg); color: var(--ink); }

/* phones and tablets held upright: one column, pitch as big as fits */
@media (orientation: portrait), (max-width: 600px) {
  .setup { grid-template-columns: 1fr; }
  .mini-pitch { max-width: max(14rem, min(22rem, calc((100vh - 31rem) * 50 / 69.2))); }
  .mini-pitch { max-width: max(14rem, min(22rem, calc((100dvh - 31rem) * 50 / 69.2))); }
  .quiz { grid-template-columns: minmax(0, 1fr); grid-template-areas: "q" "pitch" "legend" "fb"; grid-template-rows: auto; }
  .legend { margin-top: -0.5rem; }
  .pitch-box { width: min(100%, max(22rem, calc((100vh - 21rem) * 50 / 69.2))); }
  .pitch-box { width: min(100%, max(22rem, calc((100dvh - 21rem) * 50 / 69.2))); }
  .fbcard.pre, .fbcard.act { position: sticky; bottom: 0.625rem; z-index: 5; padding: 0.625rem; }
  .opt { font-size: 1.0625rem; padding: 0.625rem 0.75rem; }
  .qtext { font-size: 1.4375rem; }
}
@media (max-width: 480px) {
  .brand { font-size: 1.1875rem; }
  .btn-word { display: none; }
  .logo { width: 2.125rem; height: 2.125rem; font-size: 1.25rem; }
}

.fs-btn { display: inline-grid; place-items: center; min-width: 2.75rem; }
.fs-btn svg { width: 1.25rem; height: 1.25rem; display: block; }
.toast {
  position: fixed; left: 50%; bottom: max(1.25rem, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60;
  width: max-content; max-width: calc(100vw - 2rem); padding: 0.75rem 1.125rem; border-radius: 1rem;
  background: var(--ink); color: var(--bg); font-weight: 600; text-align: center; box-shadow: var(--shadow);
}

/* results */
.results { max-width: 35rem; margin: 0.625rem auto; text-align: center; }
.trophy { font-size: 4rem; line-height: 1.1; }
.rstars { font-size: 1.875rem; font-weight: 700; margin: 0.375rem 0; }
.newbest { display: inline-block; background: #fef3c7; color: #92400e; font-weight: 700; padding: 0.1875rem 0.625rem; border-radius: 62.4375rem; margin-top: 0.375rem; }
.rlist { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin: 1rem 0; }
.rlist span { padding: 0.3125rem 0.625rem; border-radius: 0.75rem; background: var(--blue-soft); font-size: 0.9375rem; }
.results .row { justify-content: center; }

/* confetti */
#confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
#confetti i { position: absolute; top: -0.875rem; width: 0.625rem; height: 0.875rem; border-radius: 0.125rem; animation: fall linear forwards; }
@keyframes fall { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(110vh) rotate(720deg); } }

/* pitch drawing */
svg text { font-family: inherit; }
.grass-edge { fill: var(--grass-edge); }
.stripe-a { fill: var(--grass-a); }
.stripe-b { fill: var(--grass-b); }
.lines * { fill: none; stroke: rgba(255, 255, 255, .9); stroke-width: .22; }
.lines .spot { fill: #fff; stroke: none; }
.goal { fill: rgba(255, 255, 255, .85); stroke: #fff; stroke-width: .2; }
.buildout { stroke: #fde68a; stroke-width: .3; stroke-dasharray: 1 .7; }
.buildout.hot { stroke: #fde047; stroke-width: .5; }
.pitch-label { fill: rgba(255, 255, 255, .92); font-size: 1.3px; font-weight: 700; letter-spacing: .12px; }
.pitch-label.side { font-size: 1.15px; }
.bo-label { fill: #fde68a; font-size: .9px; font-weight: 600; }
.restrict-lbl { fill: #fff; font-size: 1.2px; font-weight: 700; paint-order: stroke; stroke: rgba(0, 0, 0, .4); stroke-width: .28px; }
.zone { fill: rgba(253, 224, 71, .4); stroke: #fde047; stroke-width: .32; stroke-dasharray: .9 .5; animation: zonePulse 1.4s ease-in-out infinite; }
@keyframes zonePulse { 50% { fill: rgba(253, 224, 71, .18); } }
.zone-team { fill: rgba(147, 197, 253, .2); stroke: rgba(219, 234, 254, .95); stroke-width: .18; stroke-dasharray: .6 .4; }
.zone-team-lbl { fill: #eff6ff; font-size: .95px; font-weight: 700; paint-order: stroke; stroke: rgba(30, 58, 138, .6); stroke-width: .2px; }
.ghost { fill: none; stroke: rgba(255, 255, 255, .8); stroke-width: .2; stroke-dasharray: .5 .4; }
.ghost-lbl { fill: rgba(255, 255, 255, .9); font-size: .9px; font-weight: 600; }
.trail { stroke: rgba(255, 255, 255, .55); stroke-width: .2; stroke-dasharray: .5 .4; fill: none; }
.arrow { stroke: #fde047; stroke-width: .38; stroke-dasharray: .8 .5; fill: none; }
.drag-hint { fill: #fff; font-size: 1px; font-weight: 700; pointer-events: none; }
.ball-c { fill: #fff; stroke: #111; stroke-width: .12; }
.ball-p { fill: #111; }
.pl { transition: opacity .35s ease; }
.pl.hidden { opacity: 0; }
.pl .body { stroke-width: .3; }
.pl.blue .body { fill: #1d4ed8; stroke: #fff; }
.pl.white .body { fill: #fff; stroke: #1f2937; }
.pl .lbl { font-size: 1.15px; font-weight: 700; pointer-events: none; }
.pl.blue .lbl { fill: #fff; }
.pl.white .lbl { fill: #1f2937; }
.pl.you .body, .pl.me .body, .pick.sel .body { stroke: #fbbf24; stroke-width: .55; }
.pl.you .lbl { font-size: .95px; }
.pl .star { fill: #fbbf24; font-size: 1.5px; pointer-events: none; display: none; }
.pl.you .star, .pl.me .star { display: block; }
.pl.you { cursor: grab; }
.pl.you.locked { cursor: default; }
.pl.you:focus { outline: none; }
.pl.you:focus-visible .body { stroke: #fde047; stroke-width: .7; }
.you-pulse { display: none; fill: none; stroke: #fde047; stroke-width: .3; transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-out infinite; }
.pl.you .you-pulse, .pick.sel .you-pulse { display: block; }
.pl.you.locked .you-pulse { display: none; }
@keyframes pulse { 0% { opacity: .9; transform: scale(.65); } 100% { opacity: 0; transform: scale(1.35); } }
.pick { cursor: pointer; }
.pick:hover .body { fill: #2563eb; }
.pick:focus { outline: none; }
.pick:focus-visible .body { stroke: #fde047; stroke-width: .65; }

/* attacking scenes: zoomed in on their box, landscape */
.quiz.zoom .pitch-box {
  width: max(12rem, min(calc(100vw - var(--cw) - 4rem), calc((100vh - 5.5rem) * 45 / 27.6)));
  width: max(12rem, min(calc(100cqw - var(--cw) - 1.25rem), calc((100dvh - 5.5rem) * 45 / 27.6)));
}
@media (orientation: portrait), (max-width: 600px) {
  /* phones held upright: watch the play at the top, then read and answer below it */
  .quiz.zoom { grid-template-areas: "pitch" "legend" "q" "fb"; }
  .quiz.zoom .pitch-box { width: 100%; }
  .quiz.zoom .fbcard.pre, .quiz.zoom .fbcard.act { position: static; padding: 0.75rem; }
  .quiz.zoom .options { gap: 0.4375rem; }
  .quiz.zoom .opt { font-size: 1rem; padding: 0.5rem 0.625rem; gap: 0.5rem; }
  .quiz.zoom .opt .letter { width: 1.75rem; height: 1.75rem; }
  .quiz.zoom .qtext { font-size: 1.25rem; }
}
.btrail { fill: none; stroke: #fde047; stroke-width: .3; stroke-dasharray: .05 .55; stroke-linecap: round; }
.ball-shadow { fill: rgba(0, 0, 0, .45); }

     round-start / round-finished   every round

function track(path, title) {
  const send = () => { try { window.goatcounter.count({ path, title, event: true }); } catch (e) { /* ignore */ } };

  if (store.get('week', null) !== week) {
    track('weekly-player', 'Player this week');
    store.set('week', week);
  }
}

// Mirror a scene left ↔ right: x → 40 − x, Left Wing ↔ Right Wing.
const SWAP = { LW: 'RW', RW: 'LW', LD: 'RD', RD: 'LD' };
function mirrorScene(sc) {
  const mx = p => [W - p[0], p[1]];
  const sw = s => s && s.replace(/\{(LW|RW)\}/g, (m, r) => `{${SWAP[r]}}`);
  const pos = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [SWAP[k] || k, Array.isArray(v) ? mx(v) : v]));
  const step = st => Object.assign({}, st, {
    q: sw(st.q), where: sw(st.where), why: sw(st.why),
    opts: st.opts && st.opts.map(([t, g, w, to]) => [sw(t), g, sw(w), to && (SWAP[to] || to)]),
    zones: st.zones && st.zones.map(([x, y, hw, hh]) => [W - x, y, hw, hh]),
    traps: st.traps && st.traps.map(([x1, y1, x2, y2, w]) => [W - x2, y1, W - x1, y2, sw(w)]),
    targets: st.targets && st.targets.map(t => Object.assign({}, t, { to: t.to && (SWAP[t.to] || t.to), at: t.at && mx(t.at), text: sw(t.text), why: sw(t.why) })),
    kx: st.kx == null ? st.kx : 6 - st.kx,
    play: st.play && st.play.map(pos),
  });
  const ask = {};
  for (const r in sc.ask) {
    const a = sc.ask[r];
    ask[SWAP[r] || r] = Object.assign({}, a, { from: a.from && mx(a.from), good: sw(a.good), steps: a.steps.map(step) });
  }
  return Object.assign({}, sc, { id: sc.id + '~', mirrored: true, pill: sw(sc.pill), at: pos(sc.at), play: sc.play.map(pos), ask });
}
const BOX_ALL = BOX.flatMap(sc => [sc, mirrorScene(sc)]);
// Every question a position can get, grouped so a round never asks the same one twice.
function boxAsks(role) {
  const groups = {};
  for (const sc of BOX_ALL) {
    if (!sc.ask[role]) continue;
    const key = sc.id.replace('~', '') + ':' + (sc.mirrored ? SWAP[role] || role : role);
    (groups[key] = groups[key] || []).push(sc);
  }
  return Object.values(groups);
}

/* ------------------------------------------------------------------
   Positioning engine. Each shape returns a zone per role:
   { x, y, hw, hh, job } where (x, y) is the ideal spot, hw/hh are
   the half-width/half-height of the "good" zone and job is a JOBS
   key. An optional `alt` zone is also accepted in hard mode. The same
   engine drives the white team by mirroring the pitch.
------------------------------------------------------------------- */
const GOAL = { x: 20, y: 0 };
const towardMiddle = x => (x < 20 ? 1 : -1);
function Z(x, y, hw, hh, job) { return { x: clamp(x, 1, 39), y: clamp(y, 1, 59), hw, hh, job }; }
function goalSide(b, d) {
  const dx = GOAL.x - b.x, dy = GOAL.y - b.y, m = Math.hypot(dx, dy) || 1;
  return { x: b.x + dx / m * d, y: b.y + dy / m * d };
}
function pressZone(b, role) { const p = goalSide(b, 3); return Z(p.x, p.y, 3.5, 3.5, PRESS_JOB[role]); }

// Nudge teammates apart so no two zones sit on top of each other.
function relax(s, fixed) {
  const MIN = 5;
  for (let it = 0; it < 4; it++) {
    for (let i = 0; i < ROLES.length; i++) {
      for (let j = i + 1; j < ROLES.length; j++) {
        const ra = ROLES[i], rb = ROLES[j], fa = fixed.has(ra), fb = fixed.has(rb);
        if (fa && fb) continue;
        const a = s[ra], b = s[rb];
        let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d >= MIN) continue;
        if (d < 0.01) { dx = 1; dy = 0; d = 1; }
        const push = MIN - d, ux = dx / d, uy = dy / d;
        const wa = fa ? 0 : fb ? 1 : 0.5, wb = fb ? 0 : fa ? 1 : 0.5;
        a.x = clamp(a.x - ux * push * wa, 1, 39); a.y = clamp(a.y - uy * push * wa, 1, 59);
        b.x = clamp(b.x + ux * push * wb, 1, 39); b.y = clamp(b.y + uy * push * wb, 1, 59);
      }
    }
  }
  return s;
}

// Defenders in attack: one goes, one stays.
const defGoZone = (r, b) => Z(20 + INFO[r].side * 10, clamp(b.y - 6, 16, 42), 6, 6, 'defGo');
const defStayZone = (r, b) => Z(20 + INFO[r].side * 3 + (b.x - 20) * 0.15, clamp(b.y - 10, 8, 27), 6, 5, 'defStay');

function attackShape(b, carrier) {
  const s = {}, ln = laneOf(b.x), third = b.y < 20 ? 0 : b.y > 40 ? 2 : 1;
  const c = 20 + (b.x - 20) * 0.3;
  s.GK = Z(20 + (b.x - 20) * 0.25, clamp(b.y * 0.4, 4, 16), 5, 4, b.y > 30 ? 'gkHigh' : 'gkLow');

  const defHasBall = carrier === 'LD' || carrier === 'RD';
  const goSide = ln !== 0 ? ln : (b.x >= 20 ? 1 : -1);
  const goer = defHasBall ? carrier : (goSide < 0 ? 'LD' : 'RD');
  for (const r of ['LD', 'RD']) {
    if (r === goer) s[r] = defGoZone(r, b);
    else if (defHasBall && b.y < 22) s[r] = Z(20 + INFO[r].side * 8, Math.max(b.y - 4, 5), 6, 5, 'defPartner');
    else s[r] = defStayZone(r, b);
  }

  s.CM = b.y < 18
    ? Z(c, b.y + 9, 6, 5, 'cmShow')
    : Z(c, clamp(b.y + 2, 14, 46), 6, 5, third === 2 ? 'cmEdge' : 'cmSupport');
  s.ST = Z(c, clamp(b.y + 14, 38, 54), 6, 5, ['stTarget', 'stRun', 'stBox'][third]);
  for (const r of ['LW', 'RW']) {
    const sd = INFO[r].side, wideX = sd < 0 ? 4 : 36;
    if (ln === -sd && b.y > 38) s[r] = Z(20 + sd * 7, 54, 4.5, 4, 'wingBackPost');
    else if (ln === -sd) s[r] = Z(wideX, clamp(b.y + 10, 24, 52), 4, 6, 'wingFar');
    else s[r] = Z(wideX, clamp(b.y + 7, 22, 52), 4, 6, ln === sd ? 'wingBall' : 'wingWide');
  }
  const fixed = new Set(['GK']);
  if (carrier) { s[carrier] = Z(b.x, b.y - 1.3, 3, 3, null); fixed.add(carrier); }
  relax(s, fixed);

  // Ball in the middle: either defender may go, as long as the other stays.
  // The partner on the pitch shows which; in hard mode both answers count.
  if (ln === 0 && !defHasBall) {
    const stayer = goer === 'LD' ? 'RD' : 'LD';
    s[goer].alt = defStayZone(goer, b);
    s[stayer].alt = defGoZone(stayer, b);
  }
  return s;
}

// Who presses the ball first. Aggressive: we press everywhere.
function defaultPresser(b) {
  const ln = laneOf(b.x);
  if (b.y >= 30) return ln === 0 ? 'ST' : ln < 0 ? 'LW' : 'RW';
  if (ln === 0) return b.y > 12 ? 'CM' : null;
  if (b.y < 18) return ln < 0 ? 'LD' : 'RD';

      else if (b.y < 14) s[r] = Z(20 + sd * 9, 15, 5, 4.5, 'wingCorner');
      else if (b.y < 18) s[r] = Z(clamp(b.x + sd * 2.5, 2, 38), b.y - 4, 4.5, 4.5, 'wingDouble');

   Questions and results are read out automatically (toggle in the header).
   Speech always starts from a tap, which browsers require. */
const canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
const voice = { on: store.get('voice', true), pick: null };
function pickVoice() {
  try {
    const score = v => (/natural|neural|premium|enhanced/i.test(v.name) ? 4 : 0)
      + (/samantha|aria|jenny|ava|allison|google us english/i.test(v.name) ? 3 : 0)
      + (/^en[-_]US/i.test(v.lang) ? 1 : 0);
    voice.pick = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)).sort((a, b) => score(b) - score(a))[0] || null;
  } catch (e) { voice.pick = null; }
}

function speak(text, force, queue) {
  if (!canSpeak || !text || (!voice.on && !force)) return;
  try {
    if (!queue) speechSynthesis.cancel(); // queue: say it after whatever is being said now
    const clean = text.replace(/[^\p{L}\p{N}\p{P}\s]/gu, '').replace(/\s+/g, ' ').trim();
    // Short chunks: some browsers cut off long utterances.
    for (const part of clean.match(/[^.!?]+[.!?]*/g) || []) {
      const u = new SpeechSynthesisUtterance(part.trim());
      if (voice.pick) u.voice = voice.pick;
      u.rate = 0.95;
      u.pitch = 1.05;
      speechSynthesis.speak(u);

}

const pov = () => !!(state.pov && !state.coach && window.POV);

}

// spot (the bench makes no sense from your own eyes), stepped clear of anyone there.
function povStart(role, taken) {
  const p = { ...KICKOFF[role] };
  for (let i = 0; i < 6 && Object.values(taken).some(q => Math.hypot(q[0] - p.x, q[1] - p.y) < 1.6); i++) p.y -= 1.2;
  return p;
}

  for (const r of ROLES) {

    if (r !== q.role) all[r] = [pos.blue[r].x, pos.blue[r].y];
  }
  const s = q.trans ? pos.blue[q.role] : povStart(q.role, all);
  all[q.role] = [s.x, s.y];
  const hidden = state.hard ? ROLES.filter(r => r !== q.role && !holdsBall(sit, r) && !(sit.phase === 'lost' && sit.carrier === r)) : [];
  POV.start({ pos: all, ball: [q.frame.ball.x, q.frame.ball.y], you: q.role, hidden, restrict: sit.phase === 'ourGK' || sit.phase === 'theirGK' ? sit.phase : null });

}
function povBox(B) {
  const pos = {};

}
// What a tap means at each step of an attacking scene.
function povStep(B, st) {
  B.povSnap = POV.snap(); // the moment of the decision, for the answer view if it goes wrong
  B.povKeeper = st.type === 'shot' ? [17 + st.kx, st.big ? 57.6 : 59.3] : null;
  // A loose ball you haven't controlled yet: eyes on the ball, no looking around.
  POV.lockLook(st.type === 'choose' && B.si === 0 && (B.ask.tags || []).includes('loose'));
  if (st.type === 'choose') return POV.ask(null);

/* The answer view. Every decision right: stay on the end result (the ball in the
   net), looking at their goal. A mistake: go back to the moment of that decision,
   with you where you chose to be, and draw what was better. */
function povRevealBox(B) {
  if (B.povAllRight) return POV.reveal({ look: [20, 60] });
  const r = B.results[B.results.length - 1], zones = [], arrows = [], goalZones = [], key = [];
  POV.restore(B.povSnap, r.type === 'place' ? [r.pos.x, r.pos.y] : null);
  if (B.povKeeper) POV.set('K', B.povKeeper); // where their keeper stood for your shot
  let look = null;
  if (r.type === 'place') zones.push(...r.zones);
  else if (r.type === 'aim') {
    arrows.push({ from: r.from, to: r.bestC, good: true, label: 'Best' });
    arrows.push({ from: r.from, to: [r.pos.x, r.pos.y], good: false });
    look = r.bestC;
  } else if (r.type === 'shot') { goalZones.push(...r.zones); look = [20, 60]; }
  else if (r.show) {
    const to = r.show === 'goal' ? [20, 60.2] : B.pos[r.show];
    arrows.push({ from: B.pos.ball, to, good: true, label: 'Best' });
    look = to;
  }
  if (zones.length) key.push(['#fde047', 'Best spot']);
  if (arrows.some(a => a.good)) key.push(['#4ade80', 'Best ball']);
  if (arrows.some(a => !a.good)) key.push(['#ef4444', 'Your ball']);
  if (goalZones.length) key.push(['#4ade80', 'Best places to aim']);

/* ---------------- POV: playing it out ----------------

            next decision (often where to shoot), like in a real game.

// The mirrored scenes (ball on the left) need their plays mirrored too.
const swapLR = s => s && s.replace(/\{(LW|RW)\}/g, (m, r) => `{${SWAP[r]}}`);
const mxp = p => [W - p[0], ...p.slice(1)];
const mirrorBeat = bt => Object.fromEntries(Object.entries(bt).map(([k, v]) => [SWAP[k] || k, Array.isArray(v) ? mxp(v) : v]));
function mirrorPlay(s) {
  if (!s || typeof s !== 'object') return s;
  const o = { ...s };
  if (s.play) o.play = s.play.map(mirrorBeat);
  if (s.to) o.to = SWAP[s.to] || s.to;
  if (s.at) o.at = mxp(s.at);
  if (s.end) o.end = swapLR(s.end);
  if (s.right) o.right = mirrorPlay(s.right);
  if (s.opts) o.opts = s.opts.map(mirrorPlay);
  if (s.next) {
    o.next = s.next.map(st => ({
      ...st, q: swapLR(st.q), kx: st.kx == null ? st.kx : 6 - st.kx, pov: mirrorPlay(st.pov),
      opts: st.opts && st.opts.map(([t, g, w]) => [swapLR(t), g, swapLR(w)]),
    }));
  }
  return o;
}
// This question's steps, with what to play after each one (POV only: the game's own ask is untouched).
function povAsk(B) {
  const role = B.sc.mirrored ? SWAP[B.role] || B.role : B.role;
  const plays = (POV_PLAYS[B.sc.id.replace('~', '') + ':' + role] || []).map(s => (B.sc.mirrored ? mirrorPlay(s) : s));
  return Object.assign({}, B.ask, { steps: B.ask.steps.map((st, i) => Object.assign({}, st, { pov: plays[i] || {} })) });
}
// Turn the words in a beat ('you', 'touch', 'goal', 'mark', 'ball') into spots, from where everyone is now.
function povResolve(bt, pos, role) {
  const out = Object.assign({}, bt), ball = pos.ball, goal = [20, 60], you = pos[role];
  const step = (a, b, d) => { const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1; return [a[0] + (b[0] - a[0]) / L * d, a[1] + (b[1] - a[1]) / L * d]; };
  if (out.ball === 'you') out.ball = step(you, ball, 0.55);
  else if (out.ball === 'touch') {
    out.ball = step(ball, goal, 1.1);
    const holder = ROLES.filter(r => pos[r]).sort((a, b) => Math.hypot(pos[a][0] - ball[0], pos[a][1] - ball[1]) - Math.hypot(pos[b][0] - ball[0], pos[b][1] - ball[1]))[0];
    if (holder && !(holder in out)) out[holder] = step(pos[holder], goal, 0.8);
  } else if (out.ball === 'goal') {
    out.ball = [ball[0] >= 20 ? 18.3 : 21.7, 60.7, 0.25];
    if (pos.K && !('K' in out)) out.K = [pos.K[0] + (out.ball[0] - pos.K[0]) * 0.35, pos.K[1]];
  }
  for (const k in out) {
    if (out[k] === 'mark') out[k] = step(you, goal, 0.9);
    else if (out[k] === 'ball' && k !== 'ball') out[k] = step(ball, goal, -0.5);

  delete out.air;
  return bt.air ? Object.assign(out, { air: bt.air }) : out;
}
// Play beats for real: the game's own positions move too, so the next step is scored from there.
async function povPlayOn(B, beats) {
  const rec = B.povBeats[B.si] || (B.povBeats[B.si] = []);
  for (const bt of beats || []) {
    const r = povResolve(bt, Object.assign({}, B.pos), B.role);
    rec.push(r);
    await playBeats(B, [r]);
  }
}
// What goes wrong after a wrong answer: [kind, options] for POV.outcome.
function povWrong(B, st, r) {
  const spec = st.pov || {};
  if (r.type === 'choose') {
    const o = (spec.opts || [])[r.oi];
    if (typeof o === 'string') return [o];
    if (o && o.kind) return [o.kind, { to: o.to ? B.pos[o.to] : o.at }];
    return ['tooSlow'];
  }
  if (r.type === 'place') return [/offside/i.test(r.said) ? 'offside' : spec.miss || 'cutOut', { air: /^corner/.test(B.sc.id) ? 1 : 0 }];
  if (r.type === 'aim') {
    if (r.hit === 'goal') return ['saveCatch'];
    if (r.blocked) return ['deflect'];
    if (r.hit && r.hit !== 'at') return [r.g === 1 ? 'safeArrive' : 'closedDown'];
    return [r.out ? 'out' : 'nobody'];

}
// After each step in POV mode: play on if it was right, or show what goes wrong and stop.
async function povAfterStep(B, r) {
  const st = B.ask.steps[B.si], spec = st.pov || {};
  state.step = 'watch';
  watching();
  $('#replayBtn').hidden = true;
  $('#qtext').textContent = 'Watch…';
  const ok = r.type === 'place' ? r.g >= 1 : r.g === 2; // nearly the right spot is close enough to carry on
  if (!ok) {
    await POV.outcome(...povWrong(B, st, r));
    if (Q.bx !== B) return;
    B.povSteps = B.ask.steps.slice(); // what was still to come, for Show me
    B.ask.steps.length = B.results.length; // the question stops here
    return boxReveal(B);
  }
  const right = (r.type === 'choose' ? (spec.opts || [])[r.oi] : spec.right) || {};
  await povPlayOn(B, right.play);
  if (Q.bx !== B) return;
  if (right.stop) B.ask.steps.length = B.si + 1;
  else if (right.next) B.ask.steps.splice(B.si + 1, 0, ...right.next);
  B.si++;
  if (B.si >= B.ask.steps.length) {
    if (right.end) await POV.cheer(right.end === 'goal' ? 'GOAL! ⚽🎉' : fillRoles(right.end, B.role));
    if (Q.bx !== B) return;
    B.povAllRight = B.results.every(x => (x.type === 'place' ? x.g >= 1 : x.g === 2));
    return boxReveal(B);
  }
  const nst = B.ask.steps[B.si];
  if (nst.play) { await playBeats(B, nst.play); drawTrails(B); }

}
/* Show me, in POV: from the decision you got wrong, play every right decision
   through to the end result (the better choice, the pass to you, your shot…). */
async function povShowMe(B, r) {
  const si = B.results.length - 1, steps = (B.povSteps || B.ask.steps).slice();
  const play = async beats => { for (const bt of beats || []) await POV.beats([povResolve(bt, POV.positions(), B.role)]); };
  let end = null;
  for (let i = si; i < steps.length; i++) {
    const st = steps[i], spec = st.pov || {};
    if (i > si && st.play) await POV.beats(st.play);
    let right = {};
    if (st.type === 'choose') {
      // a right answer that shows something happening, if there is one
      const rights = st.opts.map((o, j) => (o[1] === 2 ? (spec.opts || [])[j] || {} : null)).filter(Boolean);
      right = rights.find(x => x.play && x.play.length) || rights[0] || {};
    } else if (st.type === 'place') {
      if (i === si) { const z = nearestZone(r); await POV.showRun([z.x, z.y]); } else await POV.runTo([st.zones[0][0], st.zones[0][1]]);
      right = spec.right || {};
    } else if (st.type === 'aim') {
      const best = st.targets.reduce((a, t) => (t.g > a.g ? t : a)), pos = POV.positions();
      if (i === si) POV.set('ball', r.from);
      await POV.beats([{ ms: 600, ball: best.to ? pos[best.to] : best.goal ? [19.4, 60.6] : best.at, air: B.ask.lofted ? 1 : 0 }]);
      right = spec.right || {};
      if (best.goal) end = end || 'goal';
    } else if (st.type === 'shot') {
      const z = shotZones(st.kx, st.big ? 1.3 : 1).sort((a, b) => (b[1] - b[0]) - (a[1] - a[0]))[0];
      if (i > si) POV.set('K', [17 + st.kx, st.big ? 57.6 : 59.3]);
      if (z) await POV.shoot({ x: (z[0] + z[1]) / 2, y: 0.35 }, 2); // a great shot goes in, and says so
      return;
    }
    await play(right.play);
    if (right.end) end = right.end;
    if (right.stop) break;
    if (right.next) steps.splice(i + 1, 0, ...right.next);
  }
  await POV.cheer(!end || end === 'goal' ? 'GOAL! ⚽🎉' : fillRoles(end, B.role));

/* ---------------- quiz ---------------- */
const Q = {};
const cur = () => state.round[state.i];

/* A round is 10 questions from the ticked categories. With Shooting &
   crossing ticked, the Center Mid, wings and Striker get 10 attacking
   scenes on top, so their round is 20. */
function buildRound() {
  const role = state.role, wantBox = state.phases.includes('box') && BOX_ROLES.includes(role);
  let cats = state.phases.filter(c => c !== 'box');
  if (!cats.length && !wantBox) cats = ['gk', 'open', 'trans']; // only 🎯 ticked, but this position has none
  const boxN = wantBox ? Math.min(10, boxAsks(role).length) : 0;
  const regN = !cats.length ? 0 : wantBox ? 20 - boxN : 10;
  const regular = regN ? buildRegular(cats, regN) : [];
  return shuffle([...regular, ...(boxN ? pickBox(role, boxN) : [])]);
}
// Each game's attacking scenes: exactly 2 loose balls in the box, wingers exactly 3 byline runs, the rest a mix.
function pickBox(role, n) {
  const groups = shuffle(boxAsks(role)), tags = g => g[0].ask[role].tags || [];
  const quota = { loose: 2 };
  if (role === 'LW' || role === 'RW') quota.byline = 3;
  const chosen = [];
  for (const tag in quota) chosen.push(...groups.filter(g => tags(g).includes(tag) && !chosen.includes(g)).slice(0, quota[tag]));
  const rest = groups.filter(g => !chosen.includes(g));
  const plain = rest.filter(g => !tags(g).some(t => t in quota)); // keep the quotas exact when there's enough else
  for (const g of [...plain, ...rest]) if (chosen.length < n && !chosen.includes(g)) chosen.push(g);
  return shuffle(chosen.slice(0, n)).map(variants => {
    const sc = pick(variants);
    return { box: true, sc, ask: sc.ask[role], role, stars: null };
  });
}
function buildRegular(phases, N) {
  const pools = { gk: [], open: [], trans: [] };
  for (const sit of SITUATIONS) {
    const cat = PHASES[sit.phase].cat;
    if (!phases.includes(cat) || holdsBall(sit, state.role)) continue;
    pools[cat].push(sit);
  }
  Object.values(pools).forEach(shuffle);
  // Always include "you got tackled" for this position.
  const mine = pools.trans.findIndex(s => s.phase === 'lost' && s.carrier === state.role);
  if (mine > 0) pools.trans.unshift(pools.trans.splice(mine, 1)[0]);

  const weights = { gk: 2, open: 4, trans: 4 };
  const cats = phases.filter(c => pools[c].length);
  const totalW = cats.reduce((a, c) => a + weights[c], 0);
  const quota = {};
  cats.forEach(c => { quota[c] = Math.min(pools[c].length, Math.round(N * weights[c] / totalW)); });
  const count = () => cats.reduce((a, c) => a + quota[c], 0);
  while (count() < N) {
    const open = cats.filter(c => quota[c] < pools[c].length).sort((a, b) => quota[a] / weights[a] - quota[b] / weights[b]);
    if (!open.length) break;
    quota[open[0]]++;
  }
  while (count() > N) quota[cats.slice().sort((a, b) => quota[b] - quota[a])[0]]--;
  const picked = [];
  cats.forEach(c => picked.push(...pools[c].slice(0, quota[c])));
  return shuffle(picked).map(sit => ({
    sit, role: state.role, frame: buildFrame(sit), trans: isTrans(sit), stars: null,
  }));
}

function startRound() {

function svgPt(e) {
  const m = Q.svg.getScreenCTM();
  if (!m) return null;
  const pt = Q.svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(m.inverse());
  return { x: p.x, y: L - p.y };
}
function moveYou(p) {
  if (!p) return;
  Q.youPos = { x: clamp(p.x, -2.4, 44.4), y: clamp(p.y, -3, L + 3) };
  place(Q.you, Q.youPos);
  if (!state.moved) {
    state.moved = true;
    if (Q.benchHint) Q.benchHint.remove();
    $('#checkBtn').disabled = false;
  }
}
function onDown(e) {
  if (!state.coach && Q.bx) return boxDown(e);
  if (state.coach || state.step !== 'place' || !cur()) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  const p = svgPt(e);
  if (!p) return;
  Q.dragging = true;
  try { Q.svg.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  if (Q.you.contains(e.target)) Q.off = { x: Q.youPos.x - p.x, y: Q.youPos.y - p.y };
  else { Q.off = { x: 0, y: 0 }; moveYou(p); }
}
function onMove(e) {
  if (!Q.dragging) return;
  e.preventDefault();
  if (Q.bx) return boxMoveEv(e);
  const p = svgPt(e);
  if (p) moveYou({ x: p.x + Q.off.x, y: p.y + Q.off.y });
}
function onUp(e) {
  if (!Q.dragging) return;
  Q.dragging = false;
  try { Q.svg.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
}
function onYouKey(e) {
  if (state.step !== 'place' || state.coach) return;
  const step = e.shiftKey ? 3 : 1;
  let p = { ...Q.youPos };
  if (!state.moved && !cur().trans && e.key.startsWith('Arrow')) p = { x: 20, y: 30 };
  else if (e.key === 'ArrowUp') p.y += step;
  else if (e.key === 'ArrowDown') p.y -= step;
  else if (e.key === 'ArrowLeft') p.x -= step;
  else if (e.key === 'ArrowRight') p.x += step;
  else if (e.key === 'Enter') { e.preventDefault(); if (state.moved) lockSpot(); return; }
  else return;
  e.preventDefault();
  moveYou(p);
}

  $('#qprompt').hidden = which === 'post'; // once answered, the answer box says it all
  $('#fb').classList.toggle('pre', which === 'pre');
  $('#fb').classList.toggle('act', which === 'act');
}
function setPrompt(tag, text, say) {
  $('#stepTag').textContent = tag;
  $('#qtext').textContent = text;

  speak(say);
}

// Step 1: where should you be?
function renderQuestion() {
  if (cur().box) return renderBox(cur());
  const q = cur(), f = q.frame, sit = q.sit, Ls = Q.P.layers;
  state.step = 'place';
  state.moved = q.trans;
  clearPitch();
  setView('full');
  $('#replayBtn').hidden = true;
  $('#teamBtn').hidden = false;
  $('#chkMove').hidden = false;
  $('#checkBtn').textContent = "That's my spot ✅";
  drawRestriction(Q.P, sit.phase);

  const pos = q.trans ? f.before : f;
  Q.els = { blue: {}, white: {} };
  for (const r of ROLES) {
    const g = makePlayer(Ls.players, 'white', r === 'GK' ? 'GK' : '');
    place(g, pos.white[r]);
    Q.els.white[r] = g;
  }
  for (const r of ROLES) {
    if (r === q.role) continue;
    const g = makePlayer(Ls.players, 'blue', r);
    place(g, pos.blue[r]);
    if (state.hard && !holdsBall(sit, r) && !(sit.phase === 'lost' && sit.carrier === r)) g.classList.add('hidden');
    Q.els.blue[r] = g;
  }
  place(makeBall(Ls.players), f.ball);

  if (q.trans) {
    const s = pos.blue[q.role];
    el('circle', { cx: s.x, cy: sy(s.y), r: 1.6, class: 'ghost' }, Ls.arrows);
    txt(Ls.arrows, s.x, sy(s.y) + 2.6, 'you were here', 'ghost-lbl');
  }
  Q.you = makePlayer(Ls.you, 'blue', 'YOU', true);
  Q.you.setAttribute('tabindex', '0');
  Q.you.setAttribute('role', 'button');
  Q.you.setAttribute('aria-label', 'Your player. Drag it, or use the arrow keys, then press Enter.');
  Q.you.addEventListener('keydown', onYouKey);
  Q.youPos = q.trans ? { ...pos.blue[q.role] } : { ...BENCH };
  place(Q.you, Q.youPos);
  Q.benchHint = q.trans ? null : txt(Ls.you, BENCH.x, sy(BENCH.y) + 3, 'drag me!', 'drag-hint');
  if (povPrep()) povRegular(q, pos);

  setSituation(sit, q.role);
  $('#youRole').textContent = INFO[q.role].name;
  $('#starBox').hidden = false;
  $('#qdots').hidden = false;
  $('#readBtn').hidden = !canSpeak;
  $('#starTotal').textContent = state.stars;
  showPanel('pre');
  $('#checkBtn').disabled = !state.moved;
  renderDots();

  const ask = q.trans ? 'Where do you go?' : 'Where should you be?';
  const who = (state.name ? state.name + ', you' : 'You') + `'re the ${INFO[q.role].name}.`;
  setPrompt('1. Your spot', ask, `${who} ${sentence(situationText(sit, q.role))} ${ask}`);
}

// Step 2: what should you do? (Nothing is revealed until this is answered.)
function lockSpot() {
  const q = cur();
  if (q && q.box) return boxConfirm();
  if (!q || state.step !== 'place' || !state.moved) return;
  state.step = 'act';
  Q.dragging = false;
  Q.you.classList.add('locked');
  if (pov()) { POV.ask(null); POV.runTo([Q.youPos.x, Q.youPos.y]); } // run there while the options come up

  const p = Q.youPos;
  let z = q.frame.target[q.role], d = distToZone(p, z);
  if (state.hard && z.alt) {
    const da = distToZone(p, z.alt);
    if (da < d) { z = z.alt; d = da; }
  }
  const off = p.x < 0 || p.x > W || p.y < 0 || p.y > L;
  const crossed = q.sit.phase === 'theirGK' && p.y > BO_OPP;
  let spot = d === 0 ? 3 : d <= 4 ? 2 : d <= 8 ? 1 : 0;
  if (off || crossed) spot = 0;
  q.zone = z;
  q.spot = { stars: spot, off, crossed };

  const job = JOBS[z.job];
  q.options = shuffle([{ text: job.act, ok: true }, ...shuffle(job.wrong.slice()).slice(0, 2).map(t => ({ text: t, ok: false }))]);
  const box = $('#options');
  box.textContent = '';
  q.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = 'ABC'[i];
    const label = document.createElement('span');
    label.textContent = o.text;
    b.append(letter, label);
    b.addEventListener('click', () => answer(i));
    box.appendChild(b);
  });
  showPanel('act');
  const say = 'What should you do? ' + q.options.map((o, i) => `${'ABC'[i]}: ${sentence(o.text)}`).join(' ');
  setPrompt('2. Your move', 'What should you do?', say);
  box.querySelector('.opt').focus({ preventScroll: true });
}

// Step 3: score both answers, reveal, and explain.
function answer(i) {
  const q = cur();
  if (!q || state.step !== 'act') return;
  state.step = 'done';
  const f = q.frame, z = q.zone, p = Q.youPos;
  const moveOk = q.options[i].ok;
  const total = q.spot.stars + (moveOk ? MOVE_POINTS : 0);
  q.stars = total;
  state.stars += total;

  const Ls = Q.P.layers;
  Q.zone = drawZone(Ls.zones, z, 'zone');
  Ls.players.querySelectorAll('.hidden').forEach(g => g.classList.remove('hidden'));
  if (q.trans) {
    const moves = [];
    for (const r of ROLES) {
      if (r !== q.role) moves.push({ g: Q.els.blue[r], from: f.before.blue[r], to: f.blue[r] });
      moves.push({ g: Q.els.white[r], from: f.before.white[r], to: f.white[r] });
    }
    animateMoves(moves, 1200);
  }
  if (q.spot.stars < 3) drawArrow(p, z);

  const fb = feedbackFor(q, moveOk);
  $('#showMeBtn').hidden = q.spot.stars === SPOT_MAX;
  $('#teamBtn').textContent = '👥 Team';
  showAnswer(fb, total, [`📍 Spot ${fb.spotOk ? '✅' : '❌'}`, `⚡ Move ${moveOk ? '✅' : '❌'}`]);
  if (pov()) {
    if (q.trans) {
      const to = {};
      for (const r of ROLES) { if (r !== q.role) to[r] = [f.blue[r].x, f.blue[r].y]; to['w' + r] = [f.white[r].x, f.white[r].y]; }
      POV.moveAll(to, 1200);
    }
    POV.reveal({ zones: [z], key: [['#fde047', 'Best spot']] });
  }
}

// The answer box, for both kinds of question.
function showAnswer(fb, total, chips) {

function drawArrow(from, z) {
  if (Q.arrow) Q.arrow.remove();
  const dx = z.x - from.x, dy = z.y - from.y, len = Math.hypot(dx, dy);
  if (len < 2.5) return;
  const s = 1.9 / len;
  Q.arrow = el('line', {
    x1: from.x + dx * s, y1: sy(from.y + dy * s), x2: z.x, y2: sy(z.y),
    class: 'arrow', 'marker-end': `url(#${Q.P.id}Arrow)`,
  }, Q.P.layers.arrows);
}
function showMe() {
  if (Q.bx) return showMeBox();

  if (Q.arrow) { Q.arrow.remove(); Q.arrow = null; }
  animateMoves([{ g: Q.you, from: { ...Q.youPos }, to: { x: z.x, y: z.y } }], 700);
  Q.youPos = { x: z.x, y: z.y };
  if (pov()) POV.showRun([z.x, z.y]);
}
function drawTeamZones(sit, frame, me) {
  const Ls = Q.P.layers, group = el('g', null);
  Ls.zones.insertBefore(group, Ls.zones.firstChild);
  for (const r of ROLES) {
    if (r === me || holdsBall(sit, r)) continue;
    const z = frame.target[r], rr = zoneRect(z);
    drawZone(group, z, 'zone-team');
    txt(group, rr.x1 + 0.4, sy(rr.y2) + 1.1, r, 'zone-team-lbl', { 'text-anchor': 'start' });
  }
  return group;
}
function toggleTeam() {
  const q = cur();
  if (Q.teamZones) { Q.teamZones.remove(); Q.teamZones = null; $('#teamBtn').textContent = '👥 Team'; if (pov()) POV.team(null); return; }
  Q.teamZones = drawTeamZones(q.sit, q.frame, q.role);
  $('#teamBtn').textContent = '👥 Hide';
  if (pov()) POV.team(ROLES.filter(r => r !== q.role && !holdsBall(q.sit, r)).map(r => ({ ...q.frame.target[r], label: r })));
}
function next() {
  hush();
  state.i++;
  if (state.i >= state.round.length) showResults();
  else {
    renderQuestion();
    if (oneColumn()) $('#quiz').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });

/* ---------------- shooting & crossing ----------------
   A scene plays its lead-up, freezes, then asks its steps one by one.
   Q.bx holds the scene in play: where everyone is (pos), the path each
   one took (paths, drawn as trails), and the answers so far. */
const STEP_INFO = {
  choose: { ico: '⚡', chip: 'Move', label: 'What to do:', tag: 'Your move' },
  place: { ico: '📍', chip: 'Spot', label: 'Where to be:', tag: 'Your spot' },
  aim: { ico: '🎯', chip: 'Ball', label: 'Where the ball goes:', tag: 'Where it goes' },
  shot: { ico: '🥅', chip: 'Shot', label: 'Your shot:', tag: 'Your shot' },
};
const GRADE_MARK = ['❌', '🟡', '✅'];
const SHOT_BEST = 'Aim low, just inside the post, away from the keeper';
const SHOT_WHY = 'Low shots are the hardest for a keeper to reach, and aiming just inside the post keeps it on target.';
// One question is worth 5 stars: a one-step scene puts all 5 on it, a two-step scene splits 3 + 2.
const stepMax = (ask, i) => (ask.steps.length === 1 ? Q_MAX : i === 0 ? SPOT_MAX : MOVE_POINTS);
const gradePts = (g, max) => (g === 2 ? max : g === 1 ? Math.max(1, Math.round(max * 0.4)) : 0);
const lcFirst = s => s.charAt(0).toLowerCase() + s.slice(1);
const P = a => ({ x: a[0], y: a[1] });
function fillRoles(s, role) {
  if (!s) return '';
  const out = s.replace(/\{(LW|RW|ST|CM|LD|RD)\}/g, (m, r) => (r === role ? 'you' : 'our ' + INFO[r].name));
  return out.replace(/(^|[.!?]\s+)([a-z])/g, (m, a, b) => a + b.toUpperCase());
}
function bestTextOf(st) {
  if (st.type === 'choose') return st.opts.filter(o => o[1] === 2).map(o => o[0]).join(', or ');
  if (st.type === 'place') return st.where;
  if (st.type === 'aim') return st.targets.reduce((a, t) => (t.g > a.g ? t : a)).text;
  return SHOT_BEST;
}

// --- moving everyone ---
function timeline(pos, beats) {
  const segs = {}, end = Object.assign({}, pos);
  let t = 0;
  for (const b of beats) {
    for (const k in b) {
      if (k === 'ms' || k === 'air') continue;
      (segs[k] = segs[k] || []).push({ t0: t, t1: t + b.ms, a: end[k], b: b[k], air: k === 'ball' && !!b.air });
      end[k] = b[k];
    }
    t += b.ms;
  }
  return { segs, end, dur: t };
}
function segAt(list, t) {
  let s = list[0];
  for (const x of list) if (t >= x.t0) s = x;
  const u = s.t1 > s.t0 ? clamp((t - s.t0) / (s.t1 - s.t0), 0, 1) : 1;
  return { x: s.a[0] + (s.b[0] - s.a[0]) * u, y: s.a[1] + (s.b[1] - s.a[1]) * u, h: s.air ? Math.sin(Math.PI * u) : 0 };
}
function drawActor(B, id, p) {
  const g = B.els[id];
  if (!g) return;
  if (id === 'ball') placeBall(g, p, p.h || 0); else place(g, p);
}
function drawActors(B) { for (const id in B.pos) drawActor(B, id, P(B.pos[id])); }
// Play beats from where everyone is now. walk: { id: [from, to] } moves someone over the whole clip.
// In POV mode the 3D view plays them too, and we carry on once both are done.
function playBeats(B, beats, walk) {
  const p3 = pov() && Q.bx === B ? POV.beats(beats, walk) : null;
  const p2 = new Promise(resolve => {
    const tl = timeline(B.pos, beats);
    for (const id in walk || {}) {
      tl.segs[id] = [{ t0: 0, t1: tl.dur, a: walk[id][0], b: walk[id][1], air: false }];
      tl.end[id] = walk[id][1];
    }
    for (const id in tl.segs) {
      const path = B.paths[id] || (B.paths[id] = [B.pos[id]]);
      for (const s of tl.segs[id]) path.push(s.b);
    }
    const token = ++Q.animToken;
    const finish = () => { B.pos = tl.end; drawActors(B); resolve(); };
    if (reduceMotion || !tl.dur) { finish(); return; }
    const t0 = performance.now();
    const step = now => {
      if (token !== Q.animToken) return; // a replay or the next question took over
      const t = now - t0;
      for (const id in tl.segs) drawActor(B, id, segAt(tl.segs[id], t));
      if (t < tl.dur) requestAnimationFrame(step); else finish();
    };
    requestAnimationFrame(step);
  });
  return p3 ? Promise.all([p2, p3]) : p2;
}
function drawTrails(B) {
  B.trailG.textContent = '';
  for (const id in B.paths) {
    const pts = B.paths[id];
    let len = 0;
    for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (len < 0.8) continue;
    el('polyline', { points: pts.map(p => `${p[0]},${sy(p[1])}`).join(' '), class: id === 'ball' ? 'btrail' : 'trail' }, B.trailG);
  }
}
// The lead-up. If the question says where YOU are (from), you walk there instead of following the play.
function playLead(B) {
  const role = B.ask && B.ask.from ? B.role : null;
  const beats = role ? B.sc.play.map(b => { const c = Object.assign({}, b); delete c[role]; return c; }) : B.sc.play;
  return playBeats(B, beats, role ? { [role]: [B.sc.at[role], B.ask.from] } : null).then(() => drawTrails(B));
}
function makeActors(B) {
  const Ls = Q.P.layers;
  B.els = {};
  for (const id in B.sc.at) {
    if (id === 'ball') continue;
    const blue = ROLES.includes(id), you = !B.coach && id === B.role;
    const label = you ? 'YOU' : blue ? id : id === 'K' ? 'GK' : '';
    const g = makePlayer(you ? Ls.you : Ls.players, blue ? 'blue' : 'white', label, you, BOX_SCALE);
    if (B.coach && id === B.me) g.classList.add('me');
    if (you) {
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'button');
      g.setAttribute('aria-label', 'Your player. Drag it, or use the arrow keys, then press Enter.');
      g.addEventListener('keydown', boxKey);
    }
    B.els[id] = g;
  }
  B.els.ball = makeBoxBall(Ls.players);
}
function watching() {
  showPanel('pre');
  const b = $('#checkBtn');
  b.textContent = 'Watch… 👀';
  b.disabled = true;
}

// --- a question ---
function renderBox(q) {
  const sc = q.sc, ask = q.ask;
  clearPitch();
  setView('box');
  drawRestriction(Q.P, null);
  const B = Q.bx = { q, sc, ask, role: q.role, si: 0, results: [], ready: false, paths: {}, pos: Object.assign({}, sc.at) };
  state.step = 'watch';
  B.trailG = el('g', null, Q.P.layers.arrows);
  makeActors(B);
  drawActors(B);
  if (povPrep()) { B.ask = povAsk(B); B.povBeats = {}; povBox(B); }

  const poss = $('#poss');
  poss.className = 'poss we';
  poss.textContent = '🔵 ' + fillRoles(sc.pill, q.role);
  $('#youRole').textContent = INFO[q.role].name;
  $('#starBox').hidden = false;
  $('#qdots').hidden = false;
  $('#readBtn').hidden = !canSpeak;
  $('#replayBtn').hidden = false;
  $('#teamBtn').hidden = true;
  $('#starTotal').textContent = state.stars;
  renderDots();
  watching();

  const st = ask.steps[0], text = povText(fillRoles(st.q || defaultQ(st), q.role));
  const who = (state.name ? state.name + ', you' : 'You') + `'re the ${INFO[q.role].name}.`;
  B.intro = `${who} ${sentence(fillRoles(sc.pill, q.role))}`;
  $('#stepTag').textContent = stepTag(B);
  $('#qtext').textContent = text;
  Q.say = `${B.intro} ${text}`;
  speak(Q.say);
  playLead(B).then(() => boxStep(B));
}
const defaultQ = st => (st.type === 'shot' ? 'Where do you aim your shot? Drag the ball into the goal.' : 'What should you do?');
const stepTag = B => (B.ask.steps.length > 1 ? `${B.si + 1}. ` : '') + STEP_INFO[B.ask.steps[B.si].type].tag;

function boxStep(B) {
  if (Q.bx !== B) return;
  const st = B.ask.steps[B.si], text = povText(fillRoles(st.q || defaultQ(st), B.role));
  B.ready = true;
  state.step = 'box';
  if (pov()) povStep(B, st);
  $('#replayBtn').hidden = st.type === 'shot';
  $('#stepTag').textContent = stepTag(B);
  $('#qtext').textContent = text;
  const first = B.si === 0;
  if (st.type === 'choose') {
    B.opts = shuffle(st.opts.map(([t, g, why, to], oi) => ({ text: fillRoles(t, B.role), g, why: fillRoles(why, B.role), to, oi })));
    const box = $('#options');
    box.textContent = '';
    B.opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      const letter = document.createElement('span');
      letter.className = 'letter';
      letter.textContent = 'ABCDE'[i];
      const label = document.createElement('span');
      label.textContent = o.text;
      b.append(letter, label);
      b.addEventListener('click', () => boxChoose(i));
      box.appendChild(b);
    });
    showPanel('act');
    const opts = B.opts.map((o, i) => `${'ABCDE'[i]}: ${sentence(o.text)}`).join(' ');
    Q.say = first ? `${B.intro} ${text} ${opts}` : `${text} ${opts}`;
    speak(first ? opts : Q.say, false, first);
    box.querySelector('.opt').focus({ preventScroll: true });
    // side by side on a short screen: bring the options up if they start below it
    requestAnimationFrame(() => {
      const r = box.getBoundingClientRect();
      if (!oneColumn() && r.top > innerHeight - 80) window.scrollBy({ top: r.top - innerHeight + 140, behavior: reduceMotion ? 'auto' : 'smooth' });
    });
    return;
  }
  showPanel('pre');
  const btn = $('#checkBtn');
  if (st.type === 'place') {
    startDrag(B, B.els[B.role], P(B.pos[B.role]), 'field');
    btn.textContent = "That's my spot ✅";
    btn.disabled = false;
  } else if (st.type === 'aim') {
    const ball = B.pos.ball, mk = el('g', { class: 'aim-mark', tabindex: 0, role: 'button', 'aria-label': 'Where the ball goes. Drag it, or use the arrow keys, then press Enter.' }, Q.P.layers.you);
    el('circle', { r: 1.3, class: 'ring' }, mk);
    makeBall(el('g', { transform: `scale(${BOX_SCALE})` }, mk));
    mk.addEventListener('keydown', boxKey);
    B.aimLine = el('line', { class: 'aim-line' }, Q.P.layers.arrows);
    B.hint = txt(Q.P.layers.you, ball[0], sy(ball[1]) + 2.4, 'drag me!', 'drag-hint');
    startDrag(B, mk, P(ball), 'field');
    btn.textContent = 'Kick it here ⚽';
    btn.disabled = true;
  } else {
    setView('goal');
    const lay = Q.gf.layer;
    drawKeeper(lay, st.kx, st.big);
    B.hint = txt(lay, GF_X + 3, -3.15, 'Drag the ball to where you would aim', 'gf-hint');
    const mk = el('g', { class: 'aim-mark small', tabindex: 0, role: 'button', 'aria-label': 'Your shot. Drag it into the goal, or use the arrow keys, then press Enter.' }, lay);
    el('circle', { r: 0.34, class: 'ring' }, mk);
    makeBall(el('g', { transform: 'scale(.26)' }, mk));
    mk.addEventListener('keydown', boxKey);
    startDrag(B, mk, { x: 3, y: -1.3 }, 'goal');
    btn.textContent = 'Shoot! ⚽';
    btn.disabled = true;
  }
  Q.say = first ? `${B.intro} ${text}` : text;
  if (!first) speak(text);
  B.drag.g.focus({ preventScroll: true });
}

// --- dragging YOU, the pass, or the shot ---
function startDrag(B, g, pos, kind) {
  B.drag = { g, pos, kind, moved: false };
  g.classList.remove('locked');
  moveDragTo(B, pos, true);
}
function moveDragTo(B, p, init) {

  drawRestriction(Q.P, null);
  const B = Q.bx = { coach: true, sc, ask, role, me: role, si: 0, paths: {}, pos: Object.assign({}, sc.at) };
  B.trailG = el('g', null, Q.P.layers.arrows);
  makeActors(B);
  drawActors(B);
  const poss = $('#poss');
  poss.className = 'poss we';
  poss.textContent = '🔵 ' + fillRoles(sc.pill, null);
  $('#stepTag').textContent = 'Coach view · 🎯 Shooting & crossing';
  $('#youRole').textContent = INFO[role].name;
  $('#starBox').hidden = true;
  $('#qdots').hidden = true;
  $('#readBtn').hidden = true;
  $('#replayBtn').hidden = true;
  const who = BOX_ROLES.filter(r => sc0.ask[r] || mirror.ask[r]).map(r => INFO[r].name).join(', ');
  $('#coachTip').textContent = ask
    ? ask.steps.map(st => `${STEP_INFO[st.type].ico} ${sentence(fillRoles(bestTextOf(st), role))}`).join('  ➜  ')
    : `No question for the ${INFO[role].name} in this one. It has questions for: ${who}.`;
  $('#coachAct').textContent = ask ? '🧠 ' + RULES[ask.rule] : '';
  $('#coachAct').hidden = !ask;
  showPanel('coach');
  let p = playLead(B);
  if (ask) for (let i = 1; i < ask.steps.length; i++) {
    const play = ask.steps[i].play;
    if (play) p = p.then(() => playBeats(B, play)).then(() => drawTrails(B));
  }
  p.then(() => {
    if (Q.bx !== B || !ask) return;
    for (const st of ask.steps) {
      if (st.type === 'place') st.zones.forEach(([x, y, hw, hh]) => drawZone(Q.P.layers.zones, { x, y, hw, hh }, 'zone'));
      if (st.type === 'aim') {
        const t = st.targets.reduce((a, x) => (x.g > a.g ? x : a));
        drawBestPass(B.pos.ball, t.to ? B.pos[t.to] : t.goal ? [20, 60.4] : t.at);
      }
    }
  });
}

/* ---------------- go ---------------- */
countPlayer(); // before initSetup, which saves settings and would make every browser look returning
initSetup();
initQuiz();
show('setup');
})();
</script>
